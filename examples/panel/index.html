<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>nexus-raw panel</title>
<style>
  :root {
    --bg: #10151b;
    --panel: #171e26;
    --line: #26313c;
    --text: #d9e2ea;
    --dim: #8496a5;
    --accent: #4da3ff;
    --ok: #46c483;
    --bad: #e0716f;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 14px/1.5 system-ui, sans-serif;
  }
  header {
    display: flex;
    align-items: baseline;
    gap: 12px;
    padding: 14px 20px;
    border-bottom: 1px solid var(--line);
  }
  header h1 { font-size: 17px; margin: 0; }
  header span { color: var(--dim); font-size: 12px; }
  main {
    display: grid;
    grid-template-columns: 2fr 3fr;
    gap: 12px;
    padding: 12px 20px;
  }
  @media (max-width: 900px) { main { grid-template-columns: 1fr; } }
  .pane {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 12px;
    min-height: 220px;
  }
  .pane h2 { font-size: 13px; margin: 0 0 10px; color: var(--accent); text-transform: uppercase; letter-spacing: 0.06em; }
  form { display: flex; gap: 8px; margin-bottom: 10px; }
  input[type="url"], input[type="text"] {
    flex: 1;
    background: #0d1218;
    color: var(--text);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 7px 9px;
    font: inherit;
  }
  input:focus { outline: 1px solid var(--accent); }
  button {
    background: #1d3450;
    color: var(--text);
    border: 1px solid #2d4a6e;
    border-radius: 6px;
    padding: 7px 12px;
    font: inherit;
    cursor: pointer;
  }
  button:hover { background: #24425f; }
  ul.list { list-style: none; margin: 0; padding: 0; }
  ul.list li {
    padding: 6px 8px;
    border-radius: 6px;
    display: flex;
    gap: 8px;
    align-items: baseline;
  }
  ul.list li.clickable { cursor: pointer; }
  ul.list li.clickable:hover { background: #1f2933; }
  ul.list li.selected { background: #20324a; }
  ul.list li.disabled { opacity: 0.45; }
  .name { color: var(--text); }
  li.clickable .name:hover { color: var(--accent); }
  .dir .name { font-weight: 600; }
  .kind { font-size: 11px; padding: 1px 7px; border-radius: 999px; border: 1px solid var(--line); color: var(--dim); }
  .kind.group { color: #d8a657; }
  .kind.hosted { color: var(--ok); }
  .url { color: var(--dim); font-size: 12px; margin-left: auto; }
  .hint { color: var(--dim); }
  nav.crumbs {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
    margin-bottom: 10px;
    font-size: 13px;
  }
  nav.crumbs a { color: var(--accent); cursor: pointer; }
  nav.crumbs a:hover { text-decoration: underline; }
  nav.crumbs .sep { color: var(--dim); }
  nav.crumbs .here { color: var(--text); font-weight: 600; }
  section.wide {
    margin: 0 20px 12px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 12px;
  }
  section.wide h2 { font-size: 13px; margin: 0 0 10px; color: var(--accent); text-transform: uppercase; letter-spacing: 0.06em; }
  #down-note { color: var(--dim); }
  #log {
    margin: 0;
    background: #0d1218;
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 10px;
    max-height: 260px;
    overflow-y: auto;
    font: 12px/1.6 ui-monospace, monospace;
    white-space: pre-wrap;
    word-break: break-all;
  }
  #log .ok { color: var(--ok); }
  #log .bad { color: var(--bad); }
  #log .dim { color: var(--dim); }
</style>
</head>
<body>
<header>
  <h1>nexus-raw panel</h1>
  <span>a web surface over the nxr Node bindings</span>
</header>

<main>
  <section class="pane" id="pane-repos">
    <h2>Server and repositories</h2>
    <form id="server-form">
      <input id="server-url" type="url" value="http://127.0.0.1:8099" required>
      <button type="submit">List repositories</button>
    </form>
    <ul class="list" id="repo-list"></ul>
  </section>

  <section class="pane" id="pane-browser">
    <h2>Browser</h2>
    <nav class="crumbs" id="crumbs"></nav>
    <p class="hint" id="browser-hint">Pick a raw repository on the left.</p>
    <ul class="list" id="entry-list"></ul>
  </section>
</main>

<section class="wide" id="download">
  <h2>Download</h2>
  <p class="hint" id="down-scope">Scope: nothing picked yet.</p>
  <form id="down-form">
    <input id="down-dir" type="text" value="panel-downloads" required>
    <button type="submit">Download this directory</button>
    <span id="down-note"></span>
  </form>
</section>

<section class="wide" id="progress">
  <h2>Progress</h2>
  <pre id="log"></pre>
</section>

<script>
'use strict'

// The browser is a plain file tree over `lsEntries`: breadcrumbs above,
// `name/` rows for folders, `name` rows for files, any depth.
const state = { serverUrl: null, repoUrl: null, repoName: null, dirSegs: [] }

const $ = (id) => document.getElementById(id)

const esc = (s) => s.replaceAll('&', '&amp;').replaceAll('<', '&lt;').replaceAll('>', '&gt;').replaceAll('"', '&quot;')

function logLine(text, cls) {
  const line = document.createElement('div')
  if (cls) line.className = cls
  line.textContent = `[${new Date().toLocaleTimeString()}] ${text}`
  $('log').append(line)
  $('log').scrollTop = $('log').scrollHeight
}

async function api(path, init) {
  const res = await fetch(path, init)
  const body = await res.json().catch(() => ({}))
  if (!res.ok) {
    const hint = body.hint ? ` (${body.hint})` : ''
    throw new Error(`${body.error ?? res.statusText}${hint}`)
  }
  return body
}

// ---- repositories --------------------------------------------------------

$('server-form').addEventListener('submit', async (e) => {
  e.preventDefault()
  state.serverUrl = $('server-url').value
  try {
    const repos = await api(`/api/repos?url=${encodeURIComponent(state.serverUrl)}`)
    $('repo-list').innerHTML = ''
    for (const repo of repos) {
      const li = document.createElement('li')
      const raw = repo.format === 'raw'
      li.className = raw ? 'clickable' : 'disabled'
      li.title = raw ? '' : `format ${repo.format}: only raw repositories are navigable`
      li.innerHTML = `<span class="name">${esc(repo.name)}</span><span class="kind ${esc(repo.kind)}">${esc(repo.kind)}</span><span class="kind">${esc(repo.format)}</span><span class="url">${esc(repo.url)}</span>`
      if (raw) {
        li.addEventListener('click', () => pickRepo(repo, li))
      }
      $('repo-list').append(li)
    }
  } catch (err) {
    $('repo-list').innerHTML = ''
    logLine(`repos failed: ${err.message}`, 'bad')
  }
})

async function pickRepo(repo, li) {
  state.repoUrl = repo.url.endsWith('/') ? repo.url : `${repo.url}/`
  state.repoName = repo.name
  state.dirSegs = []
  for (const el of document.querySelectorAll('#repo-list li')) el.classList.remove('selected')
  li.classList.add('selected')
  renderCrumbs()
  loadEntries()
}

// ---- tree browser --------------------------------------------------------

// The directory URL of the current tree position.
function dirUrl() {
  const rest = state.dirSegs.map(encodeURIComponent).join('/')
  return `${state.repoUrl}${rest}${state.dirSegs.length === 0 ? '' : '/'}`
}

function renderCrumbs() {
  const nav = $('crumbs')
  nav.innerHTML = ''
  const home = document.createElement('a')
  home.textContent = state.repoName
  home.addEventListener('click', () => ascend(-1))
  nav.append(home)
  state.dirSegs.forEach((seg, i) => {
    nav.append(Object.assign(document.createElement('span'), { className: 'sep', textContent: '/' }))
    if (i === state.dirSegs.length - 1) {
      nav.append(Object.assign(document.createElement('span'), { className: 'here', textContent: seg }))
      return
    }
    const link = document.createElement('a')
    link.textContent = seg
    link.addEventListener('click', () => ascend(i))
    nav.append(link)
  })
  $('down-scope').textContent = `Scope: ${state.repoName}${state.dirSegs.length === 0 ? ' (whole repository)' : `/${state.dirSegs.join('/')}`}`
}

// Descend into a folder: extend the path and list the children.
function descend(name) {
  state.dirSegs.push(name)
  renderCrumbs()
  loadEntries()
}

// Climb to the breadcrumb level `i` (-1 is the repository root).
function ascend(i) {
  state.dirSegs = state.dirSegs.slice(0, i + 1)
  renderCrumbs()
  loadEntries()
}

async function loadEntries() {
  const url = dirUrl()
  $('browser-hint').textContent = `Loading ${url}...`
  $('entry-list').innerHTML = ''
  try {
    const entries = await api(`/api/entries?url=${encodeURIComponent(url)}`)
    $('browser-hint').textContent = entries.length === 0 ? 'Empty directory.' : `${entries.length} entr${entries.length === 1 ? 'y' : 'ies'}:`
    for (const entry of entries) {
      const li = document.createElement('li')
      if (entry.kind === 'dir') {
        li.className = 'clickable dir'
        li.innerHTML = `<span class="name">${esc(entry.name)}/</span><span class="kind">dir</span>`
        li.addEventListener('click', () => descend(entry.name))
      } else {
        li.innerHTML = `<span class="name">${esc(entry.name)}</span><span class="kind">file</span>`
      }
      $('entry-list').append(li)
    }
  } catch (err) {
    $('browser-hint').textContent = err.message
  }
}

// ---- download ------------------------------------------------------------

$('down-form').addEventListener('submit', async (e) => {
  e.preventDefault()
  if (!state.repoUrl) {
    $('down-note').textContent = 'Pick a repository first.'
    return
  }
  const body = { url: dirUrl(), path: state.dirSegs.join('/'), dir: $('down-dir').value }
  $('down-note').textContent = `Subtree ${body.path === '' ? '(repository root)' : body.path}: the server walks it and names every file explicitly.`
  try {
    const { id } = await api('/api/down', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify(body),
    })
    follow(id)
  } catch (err) {
    logLine(`start failed: ${err.message}`, 'bad')
  }
})

function follow(id) {
  logLine(`job ${id}: stream open`, 'dim')
  const es = new EventSource(`/api/progress/${encodeURIComponent(id)}`)
  es.onmessage = (m) => {
    const frame = JSON.parse(m.data)
    if (frame.type === 'start') logLine(`down ${frame.url} -> ${frame.dir} (${frame.names} file(s))`, 'dim')
    if (frame.type === 'event') logEvent(frame.event)
    if (frame.type === 'end') {
      if (frame.ok) {
        logLine(`summary uploaded=${frame.summary.uploaded} downloaded=${frame.summary.downloaded} skipped=${frame.summary.skipped} failed=${frame.summary.failed.length}`, 'ok')
      } else {
        logLine(`failed: ${frame.error}`, 'bad')
      }
      es.close()
    }
  }
  es.onerror = () => {
    logLine('stream closed', 'dim')
    es.close()
  }
}

function logEvent(ev) {
  if (ev.event === 'artifact') {
    const bytes = ev.total ? ` ${ev.done}/${ev.total}` : ''
    logLine(`artifact ${ev.state} ${ev.name}${bytes}`)
    return
  }
  if (ev.event === 'plan') {
    logLine(`plan download=${(ev.download ?? []).length} skip=${(ev.skip ?? []).length}`)
    return
  }
  if (ev.event === 'retrying') {
    logLine(`retrying ${ev.name} attempt=${ev.attempt} ${ev.reason ?? ''}`, 'bad')
    return
  }
  logLine(JSON.stringify(ev))
}

// ---- startup -------------------------------------------------------------

// Prefill the server the panel was started with, if any.
// A classic script cannot use top-level await, so this runs detached.
;(async () => {
  try {
    const configured = await api('/api/servers')
    if (configured.length > 0) {
      $('server-url').value = configured[0]
      $('server-form').requestSubmit()
    }
  } catch {
    // No configured servers (lazy mode): the form keeps its default.
  }
})()
</script>
</body>
</html>
