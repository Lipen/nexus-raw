[package]
name = "nexus-raw-example-wasm-sandbox"
version = "0.0.0"
edition = "2021"
publish = false
description = "A browser sandbox for the nxr read surface: nexus-raw-core compiled to wasm32, listing a raw directory through a same-origin proxy"

# Standalone on purpose: excluded from the repo workspace, like the other examples.
[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
nexus-raw-core = { path = "../../crates/nexus-raw-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", default-features = false, features = ["sync"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
