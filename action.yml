name: 'nexus-raw'
description: 'Install and run nxr, the curl-style CLI for Sonatype Nexus raw storage, in a workflow.'
author: 'nexus-raw contributors'

branding:
  icon: 'upload-cloud'
  color: 'blue'

inputs:
  command:
    description: 'The nxr subcommand to run (up, down, diff, ls, …).'
    required: true
  args:
    description: 'Arguments passed to the nxr subcommand.'
    required: false
    default: ''
  version:
    description: |-
      The nxr release version to install (without the leading v).
      Empty follows the action ref when it is a full release tag, otherwise the latest release.
      Pass `latest` explicitly for the most recent release.
    required: false
    default: ''
  auth:
    description: |-
      Credentials as user:password.
      Pass through a secret: exported as NXR_USERNAME/NXR_PASSWORD and never placed in argv.
    required: false
    default: ''

runs:
  using: 'composite'
  steps:
    - name: 'Resolve the platform archive name'
      id: 'platform'
      shell: 'bash'
      run: |
        case "${{ runner.os }}/${{ runner.arch }}" in
          Linux/X64)   name="linux-x64" ;;
          Linux/ARM64) name="linux-aarch64" ;;
          macOS/X64)   name="darwin-x64" ;;
          macOS/ARM64) name="darwin-arm64" ;;
          Windows/X64) name="windows-x64" ;;
          *) echo "::error::unsupported runner: ${{ runner.os }}/${{ runner.arch }}"; exit 2 ;;
        esac
        echo "archive=nxr-${name}.tar.gz" >> "$GITHUB_OUTPUT"

    - name: 'Download and verify the archive'
      id: 'download'
      shell: 'bash'
      env:
        VERSION: '${{ inputs.version }}'
        ACTION_REF: '${{ github.action_ref }}'
        ARCHIVE: '${{ steps.platform.outputs.archive }}'
        # The caller's repository is not the action's: a composite action
        # inherits `github.repository` from the workflow, so the release URL
        # must come from `github.action_repository`. A local `uses: ./` has no
        # action repository and falls back to the checkout's own.
        ACTION_REPO: '${{ github.action_repository }}'
        WORKFLOW_REPO: '${{ github.repository }}'
        RUNNER_TEMP: '${{ runner.temp }}'
      run: |
        set -eu
        repo="${ACTION_REPO:-$WORKFLOW_REPO}"
        version="$VERSION"
        if [ -z "$version" ]; then
          case "$ACTION_REF" in
            v[0-9]*.[0-9]*.[0-9]*) version="${ACTION_REF#v}" ;;
            *) version="latest" ;;
          esac
        fi
        if [ "$version" = "latest" ]; then
          base="https://github.com/${repo}/releases/latest/download"
        else
          base="https://github.com/${repo}/releases/download/v${version}"
        fi
        dest="${RUNNER_TEMP}/${ARCHIVE}"
        curl --fail --silent --show-error --location -o "$dest" "${base}/${ARCHIVE}"
        curl --fail --silent --show-error --location -o "${RUNNER_TEMP}/SHA256SUMS" "${base}/SHA256SUMS"
        # The Windows build writes the sha256sum binary marker (`hash *file`),
        # the other platforms write two spaces: match either separator.
        line="$(awk -v f="$ARCHIVE" '$2 == f || $2 == "*" f' "${RUNNER_TEMP}/SHA256SUMS")"
        if [ -z "$line" ]; then
          echo "::error::SHA256SUMS of ${repo} has no entry for ${ARCHIVE}"
          exit 2
        fi
        expected="${line%% *}"
        # Hash by the bare name from RUNNER_TEMP: a `D:\...` operand makes
        # GNU sha256sum escape the output line, and awk would keep the `\`.
        if command -v sha256sum > /dev/null 2>&1; then
          actual="$(cd "$RUNNER_TEMP" && sha256sum "$ARCHIVE" | awk '{print $1}')"
        else
          actual="$(cd "$RUNNER_TEMP" && shasum -a 256 "$ARCHIVE" | awk '{print $1}')"
        fi
        if [ "$expected" != "$actual" ]; then
          echo "::error::checksum mismatch for ${ARCHIVE}: expected ${expected}, got ${actual}"
          exit 1
        fi

    - name: 'Unpack and install'
      id: 'install'
      shell: 'bash'
      env:
        ARCHIVE: '${{ steps.platform.outputs.archive }}'
        RUNNER_TEMP: '${{ runner.temp }}'
      run: |
        set -eu
        mkdir -p "$RUNNER_TEMP/nxr-bin"
        # Git for Windows tar treats an absolute `D:\...` source as a remote
        # host: extract the bare archive name from the directory it sits in.
        cd "$RUNNER_TEMP"
        tar -xzf "$ARCHIVE" -C nxr-bin
        # The archive root holds the binary; windows keeps the .exe suffix.
        exe="$RUNNER_TEMP/nxr-bin/nxr"
        [ "${{ runner.os }}" = Windows ] && exe="${exe}.exe"
        chmod +x "$exe"
        echo "exe=$exe" >> "$GITHUB_OUTPUT"

    - name: 'Run the command'
      id: 'run'
      shell: 'bash'
      env:
        NXR_EXE: '${{ steps.install.outputs.exe }}'
        NXR_COMMAND: '${{ inputs.command }}'
        NXR_ARGS: '${{ inputs.args }}'
        NXR_AUTH: '${{ inputs.auth }}'
      run: |
        set -eu
        if [ -n "$NXR_AUTH" ]; then
          # NXR_USERNAME/NXR_PASSWORD keep the credentials out of argv.
          user="${NXR_AUTH%%:*}"
          pass="${NXR_AUTH#*:}"
          export NXR_USERNAME="$user" NXR_PASSWORD="$pass"
        fi
        # shellcheck disable=SC2086
        "$NXR_EXE" "$NXR_COMMAND" $NXR_ARGS

outputs:
  exe:
    description: 'The absolute path of the installed nxr binary.'
    value: '${{ steps.install.outputs.exe }}'
