{#-
  Two-line source widget: the platform caption above the repo slug.
  Override of zensical's partials/source.html; keep in sync on engine upgrades.
-#}
<a href="{{ config.repo_url }}" title="GitHub — {{ config.repo_name }}" class="md-source" data-md-component="source">
  <div class="md-source__icon md-icon">
    {% set icon = config.theme.icon.repo or "fontawesome/brands/github" %}
    {% include ".icons/" ~ icon ~ ".svg" %}
  </div>
  <div class="md-source__repository">
    <span class="md-source__platform">GitHub</span>
    <span class="md-source__repo">{{ config.repo_name }}</span>
  </div>
</a>
