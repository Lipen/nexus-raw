site_name: nexus-raw
site_description: "nxr is curl for a Sonatype Nexus raw repository: primitives with retries and TLS, verified directory transfers, channel refs and explicit name lists."
repo_name: Lipen/nexus-raw
repo_url: https://github.com/Lipen/nexus-raw
site_url: https://lipen.github.io/nexus-raw/

theme:
  name: material
  logo: assets/nxr.svg
  favicon: assets/nxr.svg
  icon:
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: amber
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - search.highlight
    - search.suggest
    - toc.follow

nav:
  - Home: index.md
  - Tutorials:
      - get-started.md
      - Rust quickstart: tutorials/rust.md
      - Node quickstart: tutorials/node.md
      - Terminal quickstart: tutorials/ops.md
  - How-to:
      - Run the demo: how-to/demo.md
      - Run the browser sandbox: how-to/wasm.md
      - Publish a version: how-to/publish.md
      - Consume artifacts: how-to/consume.md
      - Read from a static host: how-to/static-host.md
      - Clone a repository: how-to/clone.md
      - Install with Homebrew: how-to/brew.md
      - Integrate it: how-to/integrate.md
      - Use in CI: how-to/ci.md
      - Run it as a container: how-to/containers.md
      - Audit a repository: how-to/audit.md
      - Keep the newest versions: how-to/retention.md
      - Compare two servers: how-to/compare.md
      - Name your remotes: how-to/config.md
      - When it breaks: how-to/troubleshoot.md
      - Drive it with an agent: how-to/agents.md
      - Install the agent skill: how-to/skills.md
  - Reference:
      - reference/cli.md
      - reference/tui.md
      - The mount: reference/mount.md
      - Wire protocol: reference/protocol.md
      - Wire invariants: reference/invariants.md
      - The mock server: reference/mock.md
      - Errors and exit codes: reference/errors.md
      - Rust API: reference/api.md
  - Explanation:
      - Design: explanation/design.md
      - Conformance: explanation/conformance.md

extra_css:
  - stylesheets/site.css

extra_javascript:
  - javascripts/terminal.js

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.keys
  - def_list
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
