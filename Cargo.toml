[workspace]
resolver = "2"
members = [
    "crates/nexus-raw-core",
    "crates/nexus-raw",
    "crates/mock-nexus",
    "crates/nexus-raw-napi",
    "crates/nexus-raw-tui",
]
exclude = ["examples"]

[workspace.package]
version = "0.5.0"
edition = "2021"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/Lipen/nexus-raw"
homepage = "https://github.com/Lipen/nexus-raw"
documentation = "https://lipen.github.io/nexus-raw/"

[workspace.dependencies]
anyhow = "1"
base64 = "0.23"
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
libc = "0.2"
log = "0.4"
napi = { version = "3", default-features = false, features = ["napi4", "async", "serde-json"] }
napi-build = "2"
napi-derive = "3"
parking_lot = "0.12"
percent-encoding = "2"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "stream", "zstd"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tempfile = "3"
thiserror = "2"
# Only features `sync,macros,io-util,rt,time` exist on wasm32: the rest of the set
# lives in per-crate `cfg(not(target_arch = "wasm32"))` sections.
# `net` is absent everywhere: no crate uses `tokio::net`, and the feature pulls
# in `mio`, which has no wasm32 implementation.
tokio = { version = "1", features = ["macros", "rt", "sync", "time", "io-util"] }
toml = "1.1"

[profile.release]
strip = true
lto = true
