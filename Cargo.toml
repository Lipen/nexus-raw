[workspace]
resolver = "2"
members = [
    "crates/nexus-raw-core",
    "crates/nexus-raw",
    "crates/mock-nexus",
    "crates/nexus-raw-napi",
]
exclude = ["examples"]

[workspace.package]
version = "0.1.1"
edition = "2021"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/Lipen/nexus-raw"
homepage = "https://github.com/Lipen/nexus-raw"
documentation = "https://lipen.github.io/nexus-raw/"

[workspace.dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "fs", "io-util", "io-std"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots", "stream"] }
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
thiserror = "2"
percent-encoding = "2"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
base64 = "0.22"
libc = "0.2"
parking_lot = "0.12"
clap = { version = "4", features = ["derive"] }
log = "0.4"
tempfile = "3"
napi = { version = "3", default-features = false, features = ["napi4", "async", "serde-json"] }
napi-derive = "3"
napi-build = "2"

[profile.release]
strip = true
lto = true
