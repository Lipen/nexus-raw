[package]
name = "nexus-raw"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
readme = "README.md"
description = "nxr: CLI for Nexus raw storage — claim, sha-siblings, symmetric diff, resume"
keywords = ["nexus", "cli", "curl", "artifacts", "devops"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "nxr"
path = "src/main.rs"

[dependencies]
# The version is what crates.io resolves; the path is what this workspace builds.
nexus-raw-core = { path = "../nexus-raw-core", version = "0.1.1" }
tokio = { workspace = true }
clap = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }

[dev-dependencies]
mock-nexus = { path = "../mock-nexus" }
tempfile = { workspace = true }
sha2 = { workspace = true }
