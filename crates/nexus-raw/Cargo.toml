[package]
name = "nexus-raw"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
readme = "README.md"
description = "Verified, resumable directory uploads and downloads for Sonatype Nexus raw repositories"
keywords = ["nexus", "cli", "curl", "artifacts", "devops"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "nxr"
path = "src/main.rs"

# Prebuilt archives from GitHub Releases, one per release target (.github/workflows/release.yml).
# Every archive unpacks nxr at its root, with README.md and LICENSE next to it.
# The linux archive is a musl build, so it serves the gnu target too.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/nxr-linux-x64.tar.gz"
bin-dir = "{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.x86_64-unknown-linux-gnu]
pkg-url = "{ repo }/releases/download/v{ version }/nxr-linux-x64.tar.gz"

[package.metadata.binstall.overrides.x86_64-unknown-linux-musl]
pkg-url = "{ repo }/releases/download/v{ version }/nxr-linux-x64.tar.gz"

[package.metadata.binstall.overrides.x86_64-apple-darwin]
pkg-url = "{ repo }/releases/download/v{ version }/nxr-darwin-x64.tar.gz"

[package.metadata.binstall.overrides.aarch64-apple-darwin]
pkg-url = "{ repo }/releases/download/v{ version }/nxr-darwin-arm64.tar.gz"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-url = "{ repo }/releases/download/v{ version }/nxr-windows-x64.tar.gz"

[dependencies]
clap = { workspace = true }
log = { workspace = true }
# The version is what crates.io resolves; the path is what this workspace builds.
nexus-raw-core = { path = "../nexus-raw-core", version = "0.5.0" }
serde_json = { workspace = true }
tokio = { workspace = true }

[dev-dependencies]
mock-nexus = { path = "../mock-nexus" }
sha2 = { workspace = true }
tempfile = { workspace = true }
