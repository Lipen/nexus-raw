[package]
name = "nexus-raw-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
readme = "README.md"
description = "Protocol core for nexus-raw: claim, sha-siblings, symmetric diff, resumable up/down against Nexus raw storage"
keywords = ["nexus", "http-client", "sha256", "resume", "artifacts"]
categories = ["api-bindings", "development-tools"]

[dependencies]
base64 = { workspace = true }
futures-util = { workspace = true }
log = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }

# Part files and local markers are opened without following symlinks.
[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[dev-dependencies]
mock-nexus = { path = "../mock-nexus" }
parking_lot = { workspace = true }
sha2 = { workspace = true }
tempfile = { workspace = true }
zstd = "0.13"
