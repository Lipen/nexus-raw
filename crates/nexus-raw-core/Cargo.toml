[package]
name = "nexus-raw-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
readme = "README.md"
description = "Protocol core for nexus-raw: claim, sha-siblings, symmetric diff, resumable up/down against Nexus raw storage"
keywords = ["nexus", "http-client", "sha256", "resume", "artifacts"]
categories = ["api-bindings", "development-tools"]

[dependencies]
base64 = { workspace = true }
futures-util = { workspace = true }
log = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }

# The fs-bound half of the crate (part files, scan, sync) is native-only:
# `fs` has no wasm32 implementation (see the gate comment on the workspace tokio).
# `io-std` stays native too: the stdout arm of `get` streams through `tokio::io::stdout`
# (stdin is never read through tokio).
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { workspace = true, features = ["fs", "io-std"] }

# The retry backoff has no tokio timer to sleep on in a browser: gloo-timers bridges to the JS event loop,
# and the jitter seed takes the place of the missing clock with the JS PRNG.
[target.'cfg(target_arch = "wasm32")'.dependencies]
gloo-timers = { version = "0.3", default-features = false, features = ["futures"] }
js-sys = "0.3"

# Part files and local markers are opened without following symlinks.
[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[dev-dependencies]
mock-nexus = { path = "../mock-nexus" }
parking_lot = { workspace = true }
sha2 = { workspace = true }
tempfile = { workspace = true }
zstd = "0.13"
