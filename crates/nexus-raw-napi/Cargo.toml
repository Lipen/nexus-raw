[package]
name = "nexus-raw-napi"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
# The artifact this crate produces is the npm package; a crates.io copy would
# be dead weight, and its prebuilt binaries are what npm consumers install.
publish = false
readme = "README.md"
description = "Node bindings for nexus-raw: the nxr surface as promises, on top of nexus-raw-core"

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { workspace = true }
napi-derive = { workspace = true }
nexus-raw-core = { path = "../nexus-raw-core" }
serde_json = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true }

[build-dependencies]
napi-build = { workspace = true }

# Unit tests link without a Node process: napi symbols become no-ops.
[dev-dependencies]
napi = { workspace = true, features = ["noop"] }
