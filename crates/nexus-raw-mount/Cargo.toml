[package]
name = "nexus-raw-mount"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
description = "A FUSE view of a Nexus raw repository: the repository as a local directory"
keywords = ["nexus", "fuse", "mount", "raw", "devops"]
categories = ["command-line-utilities", "filesystem"]
# Linux-only today (fuser has no Windows backend and macOS needs macFUSE):
# the binary ships through GitHub Releases, not through a registry.
publish = false

[[bin]]
name = "nxr-mount"
path = "src/main.rs"

[dependencies]
clap = { workspace = true }
# The version is what crates.io resolves; the path is what this workspace builds.
nexus-raw-core = { path = "../nexus-raw-core", version = "0.24.1" }

# `fuser` without the `libfuse` feature speaks the kernel protocol in pure Rust:
# no build-time libfuse, but an unprivileged mount at runtime needs `fusermount3`.
[dev-dependencies]
tempfile = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
fuser = { version = "0.18", default-features = false }
libc = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread"] }
