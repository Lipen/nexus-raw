<text class="l" x="24.7" y="90.0" fill="#eef3f4" font-weight="600" clip-path="url(#cp0)" style="animation: l0 17.38s step-end infinite">$ nxr up dist/1.4.0/ http://127.0.0.1:8734/1.4.0/ --claim-first manifest.json</text><text class="l" x="24.7" y="113.9" fill="#eef3f4" font-weight="600" clip-path="url(#cp0)" style="animation: l0 17.38s step-end infinite">--workers 1</text><text class="l" x="24.7" y="137.8" fill="#b6c8c9" style="animation: l1 17.38s step-end infinite">plan: 4 to upload, 0 to download, 0 up to date</text><text class="l" x="24.7" y="161.6" fill="#51cec7" style="animation: l2 17.38s step-end infinite">↑ manifest.json ok</text><text class="l" x="24.7" y="185.5" fill="#51cec7" style="animation: l3 17.38s step-end infinite">↑ app-1.4.0.zip ok</text><text class="l" x="24.7" y="209.4" fill="#51cec7" style="animation: l4 17.38s step-end infinite">↑ bom/linux-x86_64.json ok</text><text class="l" x="24.7" y="233.2" fill="#51cec7" style="animation: l5 17.38s step-end infinite">↑ pinned.xml ok</text><text class="l" x="24.7" y="257.1" fill="#d0d9db" style="animation: l6 17.38s step-end infinite">uploaded 4, downloaded 0, skipped 0</text><text class="l" x="24.7" y="280.9" fill="#d0d9db" style="animation: l7 17.38s step-end infinite"></text><text class="l" x="24.7" y="304.8" fill="#889597" font-style="italic" style="animation: l8 17.38s step-end infinite"># give the version a name, so consumers never hard-code it</text><text class="l" x="24.7" y="328.7" fill="#eef3f4" font-weight="600" clip-path="url(#cp9)" style="animation: l9 17.38s step-end infinite">$ nxr channel set http://127.0.0.1:8734/latest 1.4.0 --if-forward</text><text class="l" x="24.7" y="352.5" fill="#b6c8c9" style="animation: l10 17.38s step-end infinite">channel: set http://127.0.0.1:8734/latest → 1.4.0</text><text class="l" x="24.7" y="376.4" fill="#d0d9db" style="animation: l11 17.38s step-end infinite"></text><text class="l" x="24.7" y="400.3" fill="#889597" font-style="italic" style="animation: l12 17.38s step-end infinite"># fetch that version back, digests checked on the way in</text><text class="l" x="24.7" y="424.1" fill="#eef3f4" font-weight="600" clip-path="url(#cp13)" style="animation: l13 17.38s step-end infinite">$ nxr down http://127.0.0.1:8734/1.4.0/ vendor/1.4.0/ --workers 1</text><text class="l" x="24.7" y="448.0" fill="#b6c8c9" style="animation: l14 17.38s step-end infinite">plan: 0 to upload, 3 to download, 0 up to date</text><text class="l" x="24.7" y="471.9" fill="#51cec7" style="animation: l15 17.38s step-end infinite">↓ app-1.4.0.zip ok</text><text class="l" x="24.7" y="495.7" fill="#51cec7" style="animation: l16 17.38s step-end infinite">↓ bom/linux-x86_64.json ok</text><text class="l" x="24.7" y="519.6" fill="#51cec7" style="animation: l17 17.38s step-end infinite">↓ pinned.xml ok</text><text class="l" x="24.7" y="543.5" fill="#d0d9db" style="animation: l18 17.38s step-end infinite">uploaded 0, downloaded 3, skipped 0</text><text class="l" x="24.7" y="567.3" fill="#d0d9db" style="animation: l19 17.38s step-end infinite"></text><text class="l" x="24.7" y="591.2" fill="#889597" font-style="italic" style="animation: l20 17.38s step-end infinite"># check every digest offline, no network</text><text class="l" x="24.7" y="615.1" fill="#eef3f4" font-weight="600" clip-path="url(#cp21)" style="animation: l21 17.38s step-end infinite">$ nxr verify vendor/1.4.0/</text><text class="l" x="24.7" y="638.9" fill="#b6c8c9" style="animation: l22 17.38s step-end infinite">verify: 3 ok, FAILED: none</text><text class="l" x="24.7" y="662.8" fill="#d0d9db" style="animation: l23 17.38s step-end infinite">uploaded 0, downloaded 0, skipped 3</text>
