<text class="l" x="24.7" y="90.0" fill="#eef3f4" font-weight="600" clip-path="url(#cp0)" style="animation: l0 15.96s step-end infinite">$ nxr up dist/1.4.0/ http://127.0.0.1:8734/1.4.0/ --workers 1</text><text class="l" x="24.7" y="113.9" fill="#b6c8c9" style="animation: l1 15.96s step-end infinite">plan: 4 to upload, 0 to download, 0 up to date</text><text class="l" x="24.7" y="137.8" fill="#51cec7" style="animation: l2 15.96s step-end infinite">↑ app-1.4.0.zip ok</text><text class="l" x="24.7" y="161.6" fill="#51cec7" style="animation: l3 15.96s step-end infinite">↑ bom/linux-x86_64.json ok</text><text class="l" x="24.7" y="185.5" fill="#51cec7" style="animation: l4 15.96s step-end infinite">↑ names.txt ok</text><text class="l" x="24.7" y="209.4" fill="#51cec7" style="animation: l5 15.96s step-end infinite">↑ pinned.xml ok</text><text class="l" x="24.7" y="233.2" fill="#d0d9db" style="animation: l6 15.96s step-end infinite">uploaded 4, downloaded 0, skipped 0</text><text class="l" x="24.7" y="257.1" fill="#d0d9db" style="animation: l7 15.96s step-end infinite"></text><text class="l" x="24.7" y="280.9" fill="#889597" font-style="italic" style="animation: l8 15.96s step-end infinite"># a rebuild with different bytes, into the version that already landed</text><text class="l" x="24.7" y="304.8" fill="#eef3f4" font-weight="600" clip-path="url(#cp9)" style="animation: l9 15.96s step-end infinite">$ printf 'rebuilt\n' &gt;&gt; dist/1.4.0/app-1.4.0.zip</text><text class="l" x="24.7" y="328.7" fill="#eef3f4" font-weight="600" clip-path="url(#cp10)" style="animation: l10 15.96s step-end infinite">$ rm -f dist/1.4.0/app-1.4.0.zip.sha256</text><text class="l" x="24.7" y="352.5" fill="#d0d9db" style="animation: l11 15.96s step-end infinite"></text><text class="l" x="24.7" y="376.4" fill="#889597" font-style="italic" style="animation: l12 15.96s step-end infinite"># the publish refuses to overwrite a release that is already there</text><text class="l" x="24.7" y="400.3" fill="#eef3f4" font-weight="600" clip-path="url(#cp13)" style="animation: l13 15.96s step-end infinite">$ nxr up dist/1.4.0/ http://127.0.0.1:8734/1.4.0/ --workers 1</text><text class="l" x="24.7" y="424.1" fill="#ff8179" style="animation: l14 15.96s step-end infinite">error: mismatch: app-1.4.0.zip: complete on both sides with different digests: local</text><text class="l" x="24.7" y="448.0" fill="#ff8179" style="animation: l14 15.96s step-end infinite">13191eb11004b9d0061b163e514219dfc86cc71910e46ac526eb78ab3e903068, remote</text><text class="l" x="24.7" y="471.9" fill="#ff8179" style="animation: l14 15.96s step-end infinite">405e28e8bcf3d4a6a1098029dacc54c7ba14d9b08ecf2b3e15c377c0b896636a</text><text class="l" x="44.4" y="495.7" fill="#bb9679" style="animation: l15 15.96s step-end infinite">hint: the two sides diverge: delete or fix one copy, never let nxr overwrite a</text><text class="l" x="44.4" y="519.6" fill="#bb9679" style="animation: l15 15.96s step-end infinite">diverging object</text><text class="l" x="24.7" y="543.5" fill="#d0d9db" style="animation: l16 15.96s step-end infinite">(exit 1)</text>
