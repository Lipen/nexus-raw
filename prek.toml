# prek hooks: `uvx prek run --all-files`, or `just lint`.
# Install as a git hook once per clone: `uvx prek install` (or `prek install`).
# The lint contract lives in Cargo.toml; the local hooks below call the project's own toolchain,
# so the editor, `just lint` and this hook all speak one rustfmt and one clippy.
[[repos]]
repo = "local"
hooks = [
  { id = "cargo-fmt", name = "cargo fmt", entry = "cargo fmt --all -- --check", language = "system", pass_filenames = false },
  { id = "cargo-clippy", name = "cargo clippy", entry = "cargo clippy --workspace --all-targets -- -D warnings", language = "system", pass_filenames = false },
  { id = "check-external-names", name = "check external names", entry = "scripts/check-external-names.sh", language = "system", pass_filenames = false, types = ["text"] },
  { id = "check-md-semicolon", name = "check markdown semicolons", entry = "scripts/check-md-semicolon.sh", language = "system", pass_filenames = false, types = ["markdown"] },
  { id = "ruff-check", name = "ruff check", entry = "uvx ruff@0.17.1 check clients/python", language = "system", pass_filenames = false, types = ["python"] },
  { id = "ruff-format", name = "ruff format", entry = "uvx ruff@0.17.1 format --check clients/python", language = "system", pass_filenames = false, types = ["python"] },
  { id = "ty-check", name = "ty check", entry = "uvx ty@0.0.89 check clients/python/nxr.py", language = "system", pass_filenames = false, types = ["python"] },
]

[[repos]]
repo = "builtin"
hooks = [
  { id = "trailing-whitespace" },
  { id = "end-of-file-fixer" },
  { id = "check-yaml", args = ["--unsafe"] },  # mkdocs.yml carries !!python/name tags
  { id = "check-toml" },
  { id = "check-merge-conflict" },
  { id = "check-added-large-files" },
  { id = "detect-private-key" },
]
