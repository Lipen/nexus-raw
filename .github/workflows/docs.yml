name: Docs

on:
  push:
    branches: [master]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "scripts/**"
      - "skills/**"
      # The gates read the flag source and the napi typings: a flag or an export
      # that lands without its page must fail here, not only in a local check.
      - "crates/nexus-raw/src/**"
      - "crates/nexus-raw-core/src/error.rs"
      - "crates/nexus-raw-napi/index.d.ts"
      # The surface checkers read the runtime entry points too: a one-sided
      # bridge change must rebuild the site gate.
      - "crates/nexus-raw-napi/index.js"
      - "packaging/npm-bridge/**"
      # The pages quote the installer and the action: an edit to either is a
      # docs change even when no page is touched.
      - "README.md"
      - "README.ru.md"
      - "action.yml"
      - ".github/workflows/docs.yml"
  # The site builds in the PR gate with the same path filter, so a docs
  # regression is caught before the merge.
  pull_request:
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "scripts/**"
      - "skills/**"
      - "crates/nexus-raw/src/**"
      - "crates/nexus-raw-core/src/error.rs"
      - "crates/nexus-raw-napi/index.d.ts"
      # The surface checkers read the runtime entry points too: a one-sided
      # bridge change must rebuild the site gate.
      - "crates/nexus-raw-napi/index.js"
      - "packaging/npm-bridge/**"
      # The pages quote the installer and the action: an edit to either is a
      # docs change even when no page is touched.
      - "README.md"
      - "README.ru.md"
      - "action.yml"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

# Pages deployment: the artifact is built here and served by GitHub Pages.
# One-time repo setting (Settings -> Pages -> Source: GitHub Actions).
permissions:
  contents: read
  pages: write
  id-token: write

# Scoped per ref: the deploy on master keeps one run at a time, and a PR
# build lands in its own group instead of canceling the live deployment.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      # --strict: warnings (a broken link, a bad anchor) fail the build,
      # so a red deploy always means a docs regression, never a silent one.
      # The script is the single docs gate shared with `just check-docs`
      # and the release workflow.
      - run: scripts/check-docs.sh
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    needs: build
    # Only master pushes deploy: a PR gate builds the site, never publishes it.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
