name: Docs

on:
  push:
    branches: [master]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - ".github/workflows/docs.yml"
  # The site builds in the PR gate with the same path filter, so a docs
  # regression is caught before the merge.
  pull_request:
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

# Pages deployment: the artifact is built here and served by GitHub Pages.
# One-time repo setting (Settings -> Pages -> Source: GitHub Actions).
permissions:
  contents: read
  pages: write
  id-token: write

# Scoped per ref: the deploy on master keeps one run at a time, and a PR
# build lands in its own group instead of canceling the live deployment.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
      # --strict: warnings (a broken link, a bad anchor) fail the build,
      # so a red deploy always means a docs regression, never a silent one.
      - run: uvx zensical build --strict
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: site

  deploy:
    needs: build
    # Only master pushes deploy: a PR gate builds the site, never publishes it.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
