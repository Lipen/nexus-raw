name: Release

# A dispatch is the release. `just release X.Y.Z` bumps the version,
# finalizes the changelog, pushes master and dispatches this workflow on
# that exact commit. The pipeline gates on the full suite, builds every
# platform, publishes the crates, the container image, the addons and the
# npm packages, and only then the finalize job creates the tag and the GitHub
# release: a tag now attests a tree that shipped whole, and a failed run leaves
# no tag.
# `dry-run` runs the gate and every build and rehearsed staging without
# publishing anything and without creating a tag: the way to test this
# workflow without spending a version number.
on:
  workflow_dispatch:
    inputs:
      dry-run:
        description: Rehearse - gate and builds only, nothing is published, no tag
        type: boolean
        default: false

# One release at a time: a second dispatch queues behind the running one
# instead of interleaving publishes.
concurrency:
  group: release
  cancel-in-progress: false

# Least privilege: every job reads; the npm job exchanges the workflow
# identity for a registry credential, and only the finalize job writes to
# releases and tags.
permissions:
  contents: read

jobs:
  gate:
    name: Gate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          components: clippy

      - name: Set up Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          cache-on-failure: true

      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5

      # The same checks `just check` asserts locally: nothing publishes
      # until the exact dispatched tree passes the full suite.
      - name: Run rustfmt
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run tests
        run: cargo test --workspace

      # The local gate runs the whole prek hook set, not only rustfmt and
      # clippy: actionlint, the markdown rules and the hygiene hooks are part
      # of what "the same checks" means.
      - name: Run the prek hooks
        run: uvx prek@0.5.5 run --all-files

      - name: Install cargo-deny
        uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2
        with:
          tool: cargo-deny@0.20.2

      - name: Run cargo-deny
        run: cargo deny --locked check

      - name: Build the mock server
        run: cargo build -p mock-nexus

      - name: Run the python conformance suite
        working-directory: clients/python
        env:
          MOCK_NEXUS_BIN: ${{ github.workspace }}/target/debug/mock-nexus
        run: python3 test_conformance.py

      - name: Check the version agrees everywhere
        run: scripts/version-check.sh

      # A re-release of a live number is a bump away; a silent second tag
      # for the same number is not.
      - name: The version is not released yet
        if: ${{ !inputs.dry-run }}
        run: |
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml)"
          if git ls-remote --exit-code origin "refs/tags/v$version" > /dev/null 2>&1; then
            echo "tag v$version already exists: bump the version first" >&2
            exit 1
          fi
          echo "releasing $version"

  build:
    name: Build ${{ matrix.name }}
    needs: [gate]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - name: linux-aarch64
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
          - name: darwin-x64
            os: macos-latest
            target: x86_64-apple-darwin
          - name: darwin-arm64
            os: macos-latest
            target: aarch64-apple-darwin
          - name: windows-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          targets: ${{ matrix.target }}

      - name: Set up Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          cache-on-failure: true
          key: ${{ matrix.target }}

      # The musl targets link C code from ring statically.
      # That needs the musl toolchain, not just the Rust target.
      # The arm64 leg builds natively on the arm runner, so the distro
      # package covers it without any cross toolchain.
      - name: Install the musl toolchain
        if: matrix.target == 'x86_64-unknown-linux-musl' || matrix.target == 'aarch64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build nxr
        run: cargo build --locked --release -p nexus-raw --target ${{ matrix.target }}

      - name: Strip the binary
        if: runner.os != 'Windows'
        run: strip "target/${{ matrix.target }}/release/nxr"

      # The binary has to run before it ships: this catches a broken link
      # (missing loader, bad static libc) far cheaper than a user would.
      - name: Smoke the binary
        shell: bash
        run: |
          bin="target/${{ matrix.target }}/release/nxr"
          if [ "${{ runner.os }}" = Windows ]; then bin="$bin.exe"; fi
          "$bin" --version

      - name: Pack and checksum
        shell: bash
        run: |
          bin="target/${{ matrix.target }}/release/nxr"
          if [ "${{ runner.os }}" = Windows ]; then bin="$bin.exe"; fi
          mkdir stage
          cp "$bin" README.md LICENSE stage/
          cp -r skills stage/skills
          archive="nxr-${{ matrix.name }}.tar.gz"
          tar -czf "$archive" -C stage .
          # macOS ships shasum, not GNU sha256sum; the emitted lines are the
          # same "hash  name" either way, which is what SHA256SUMS needs.
          if command -v sha256sum > /dev/null 2>&1; then
            sha256sum "$archive" > "$archive.sha256"
          else
            shasum -a 256 "$archive" > "$archive.sha256"
          fi

      - name: Upload the archive
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bins-${{ matrix.name }}
          path: |
            nxr-*.tar.gz
            nxr-*.tar.gz.sha256
          if-no-files-found: error

  # The container image, assembled from the archives the build job already
  # packed: the static musl binary is copied out of nxr-linux-<arch>.tar.gz, so
  # nothing is rebuilt under emulation. distroless/static carries the CA bundle
  # TLS verification reads (a scratch base breaks every HTTPS request), a
  # nonroot user and no shell.
  # The image ships per release under the version tag and latest; a dispatch
  # rehearses the build and the smoke and pushes nothing.
  container:
    name: Container image
    needs: [gate, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      # The GHCR push authenticates with the workflow token.
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Collect the linux archives
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: bins-linux-*
          path: ${{ runner.temp }}/bins

      # The context is exactly what the Dockerfile reads: bin/<arch>/nxr per
      # platform. The binary travels in the tarball with its mode, and the image
      # has no shell to chmod it afterwards, so the mode is asserted here.
      - name: Stage the build context
        run: |
          ctx="$RUNNER_TEMP/ctx"
          mkdir -p "$ctx/bin/amd64" "$ctx/bin/arm64"
          tar -xzf "$RUNNER_TEMP/bins/bins-linux-x64/nxr-linux-x64.tar.gz" -C "$ctx/bin/amd64" ./nxr
          tar -xzf "$RUNNER_TEMP/bins/bins-linux-aarch64/nxr-linux-aarch64.tar.gz" -C "$ctx/bin/arm64" ./nxr
          test -x "$ctx/bin/amd64/nxr"
          test -x "$ctx/bin/arm64/nxr"

      # The image has to run before it ships: the same check the build job
      # applies to the bare binary, one layer down.
      - name: Smoke the image
        run: |
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml)"
          # TARGETARCH is the layout key the Dockerfile reads: the multi-arch
          # push below takes it from BuildKit, and this single-platform load
          # names the one it loads.
          docker buildx build --platform linux/amd64 --load --build-arg TARGETARCH=amd64 \
            --build-arg VERSION="$version" \
            --build-arg REVISION="$GITHUB_SHA" \
            -t nxr:smoke -f packaging/container/Dockerfile "$RUNNER_TEMP/ctx"
          docker run --rm nxr:smoke --version
          # The binary is static, but TLS verification reads the system trust
          # store through rustls-native-certs: this HEAD is the real HTTPS
          # handshake the base image exists for, and a scratch base fails it.
          docker run --rm nxr:smoke head https://github.com/

      # A dispatch rehearses the build and the smoke above and stops here: a
      # rehearsal must not move the latest tag.
      - name: Push the multi-arch image
        if: ${{ !inputs.dry-run }}
        run: |
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml)"
          # GHCR paths are lowercase, and the repository name is not.
          image="ghcr.io/$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          printf '%s' "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          # The default docker driver cannot push a manifest list: the
          # container driver runs BuildKit in a container of its own.
          # No platform is emulated, the build only copies files.
          docker buildx create --name nxr-release --driver docker-container
          docker buildx build --builder nxr-release --platform linux/amd64,linux/arm64 --push \
            --build-arg VERSION="$version" \
            --build-arg REVISION="$GITHUB_SHA" \
            -t "$image:$version" -t "$image:latest" \
            -f packaging/container/Dockerfile "$RUNNER_TEMP/ctx"
          # The manifest list is the artifact, so the push counts only when
          # both architectures read back from the registry: a half-filled list
          # would hand an amd64 binary to an arm64 node.
          manifests="$(docker buildx imagetools inspect "$image:$version")"
          printf '%s\n' "$manifests"
          for arch in linux/amd64 linux/arm64; do
            case "$manifests" in
              *"$arch"*) echo "$arch is served" ;;
              *) echo "$image:$version serves no $arch: the manifest list is incomplete" >&2; exit 1 ;;
            esac
          done
          echo "$image:$version and $image:latest are live"

  # Order matters: nexus-raw depends on nexus-raw-core by version, and the
  # crates go out only after the gate and every platform build agree the
  # tree is shippable.
  publish:
    name: Publish the crates
    needs: [gate, build]
    if: ${{ !inputs.dry-run }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable

      - name: Set up Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          cache-on-failure: true

      # A re-run after a transient failure mid-run must skip what is already
      # out, or one bad moment would poison every retry forever: the skip,
      # race and fail verdicts live in the script.
      - name: Publish nexus-raw-core
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: scripts/publish-crate.sh nexus-raw-core

      # crates.io resolves a dependent only after the index carries the
      # dependency, which takes a moment after the upload.
      - name: Wait for the index
        run: sleep 30

      # The mock is a fixture other projects' harnesses drive; it depends on
      # nothing inside the workspace, so it can publish on its own.
      - name: Publish mock-nexus
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: scripts/publish-crate.sh mock-nexus

      - name: Publish nexus-raw
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: scripts/publish-crate.sh nexus-raw

      - name: Wait for the index
        run: sleep 30

      # The TUI is a leaf: it carries nexus-raw-core, so it publishes after
      # the library it depends on is already indexed. The crate is
      # nexus-raw-tui; the binary inside keeps the nxr-tui name.
      - name: Publish nexus-raw-tui
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: scripts/publish-crate.sh nexus-raw-tui

  node:
    name: Node addon ${{ matrix.name }}
    needs: [gate, build]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        # The platform addons publish under the @nexus-raw scope.
        # The addon name carries the libc (linux-x64-gnu) and the CLI artifact
        # does not (linux-x64), so every entry names the build it stages: `bin`
        # is that artifact name, and the download below reads it. The darwin
        # legs coincide, which is why a mismatch here hid for a release.
        include:
          - name: linux-x64-gnu
            bin: linux-x64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            platform-os: linux
            platform-cpu: x64
            platform-libc: glibc
          - name: linux-arm64-gnu
            bin: linux-aarch64
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            platform-os: linux
            platform-cpu: arm64
            platform-libc: glibc
          - name: darwin-x64
            bin: darwin-x64
            os: macos-latest
            target: x86_64-apple-darwin
            platform-os: darwin
            platform-cpu: x64
          - name: darwin-arm64
            bin: darwin-arm64
            os: macos-latest
            target: aarch64-apple-darwin
            platform-os: darwin
            platform-cpu: arm64
          - name: win32-x64-msvc
            bin: windows-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            platform-os: win32
            platform-cpu: x64
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          targets: ${{ matrix.target }}

      - name: Set up Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          cache-on-failure: true
          key: node-${{ matrix.target }}

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          package_json_file: crates/nexus-raw-napi/package.json

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: crates/nexus-raw-napi/pnpm-lock.yaml

      - name: Install the dependencies
        run: cd crates/nexus-raw-napi && pnpm ci

      - name: Build the release addon
        run: cd crates/nexus-raw-napi && pnpm exec napi build --platform --release --target ${{ matrix.target }} --js binding.cjs --dts binding.d.ts

      # The staged package is what npm publish ships: the loader requires
      # the package name, and its main file is the renamed addon.
      # The CLI rides the platform package: the nxr binary the build job
      # packed is downloaded per-matrix and staged into bin/ next to the addon.
      - name: Download the CLI binary
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: bins-${{ matrix.bin }}
          path: ${{ runner.temp }}/bins

      - name: Stage the platform package
        run: |
          cd crates/nexus-raw-napi
          mkdir -p "npm/@nexus-raw/${{ matrix.name }}/bin"
          cp nexus-raw.*.node "npm/@nexus-raw/${{ matrix.name }}/index.node"
          # The CLI rides the same package: the nxr binary is the one the
          # build job packed into bins-${{ matrix.bin }} (downloaded above),
          # unpacked into bin/ next to the addon so the bin wrapper finds it
          # there. The windows archive ships nxr.exe: the wrapper already
          # expects the suffix on that platform.
          # Unpack by a bare name from inside the download directory: the tar
          # Git for Windows ships reads the runner's D:\ archive path as a
          # remote host and dies with "Cannot connect to D:".
          crate="$PWD"
          cd "$RUNNER_TEMP/bins"
          tar -xzf "nxr-${{ matrix.bin }}.tar.gz" -C "$crate/npm/@nexus-raw/${{ matrix.name }}/bin"
          cd "$crate"
          node -e '
            const fs = require("fs");
            const main = JSON.parse(fs.readFileSync("package.json", "utf8"));
            const pkg = {
              name: "@nexus-raw/nxr-" + process.argv[1],
              version: main.version,
              description: "Prebuilt nexus-raw native addon",
              license: "MIT",
              repository: main.repository,
              os: [process.argv[2]],
              cpu: [process.argv[3]],
              // npm on a musl system must skip the gnu addon instead of
              // installing it and failing at require.
              // The darwin legs carry no libc, so the field stays absent there.
              libc: process.argv[4] ? [process.argv[4]] : undefined,
              main: "index.node",
              // The whole directory, not bin/nxr: the windows leg stages
              // nxr.exe, and a plain path pattern would leave it behind.
              files: ["index.node", "bin/"],
            };
            fs.writeFileSync("npm/@nexus-raw/" + process.argv[1] + "/package.json", JSON.stringify(pkg, null, 2) + "\n");
          ' "${{ matrix.name }}" "${{ matrix.platform-os }}" "${{ matrix.platform-cpu }}" "${{ matrix.platform-libc }}"

      - name: Upload the staged package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: npm-${{ matrix.name }}
          path: crates/nexus-raw-napi/npm/@nexus-raw/${{ matrix.name }}
          if-no-files-found: error

      # binding.cjs and binding.d.ts are generated by the build, not
      # committed.
      # The publish job stages from a fresh checkout, so the generated
      # loader and typings travel with the artifacts.
      # The loader is platform-independent, and one job uploads it.
      - name: Upload the generated main-package files
        if: matrix.name == 'linux-x64-gnu'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: main-generated
          path: |
            crates/nexus-raw-napi/binding.cjs
            crates/nexus-raw-napi/binding.d.ts
          if-no-files-found: error

  npm:
    name: Publish the npm packages
    needs: [node, publish]
    # A real run publishes only after the crates are out; a rehearsal
    # exercises the staging and validation with the publish steps off.
    if: ${{ always() && needs.node.result == 'success' && (needs.publish.result == 'success' || inputs.dry-run) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      # OIDC publish: npm exchanges the workflow identity for a short-lived
      # credential, matched against the per-package trusted publisher.
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # npm >= 11.5 speaks trusted publishing.
      # Node 24 carries it.
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24

      # No merge-multiple: every artifact carries a package.json of its own,
      # a flat merge would keep only the last one downloaded.
      - name: Collect the staged packages
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: npm-*
          path: npm

      - name: Collect the generated main-package files
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: main-generated
          path: crates/nexus-raw-napi

      # Runs on dispatch too: a rehearsal must exercise the same collection
      # and validation a real release would, or it rehearses nothing.
      - name: Validate the staged packages
        run: |
          # The artifact hop flattens file modes: upload/download-artifact zips
          # the staged tree, so the exec bit the build tar carried is gone by
          # the time npm packs the package, and the installed CLI refuses to
          # spawn. Restore it here, where the packing happens.
          chmod +x npm/npm-*/bin/nxr* 2>/dev/null || true
          node <<'EOF'
          const fs = require("fs");
          const main = JSON.parse(fs.readFileSync("crates/nexus-raw-napi/package.json", "utf8"));
          const expected = [
            ["@nexus-raw/nxr-linux-x64-gnu", "npm-linux-x64-gnu"],
            ["@nexus-raw/nxr-linux-arm64-gnu", "npm-linux-arm64-gnu"],
            ["@nexus-raw/nxr-darwin-x64", "npm-darwin-x64"],
            ["@nexus-raw/nxr-darwin-arm64", "npm-darwin-arm64"],
            ["@nexus-raw/nxr-win32-x64-msvc", "npm-win32-x64-msvc"],
          ];
          for (const [name, artifact] of expected) {
            const dir = `npm/${artifact}`;
            const pkg = JSON.parse(fs.readFileSync(`${dir}/package.json`, "utf8"));
            if (!fs.existsSync(`${dir}/index.node`)) {
              throw new Error(`${dir}: index.node is missing`);
            }
            // The CLI rides the platform package: a staging that dropped it
            // would publish an addon whose bin wrapper can never spawn.
            const bin = fs.readdirSync(`${dir}/bin`).filter((f) => f.startsWith("nxr"));
            if (bin.length === 0) {
              throw new Error(`${dir}: bin carries no nxr binary`);
            }
            for (const file of bin) {
              if ((fs.statSync(`${dir}/bin/${file}`).mode & 0o111) === 0) {
                throw new Error(`${dir}: bin/${file} is not executable, npm would publish an unspawnable binary`);
              }
            }
            if (pkg.name !== name) {
              throw new Error(`${dir}: package name ${pkg.name} does not match ${name}`);
            }
            if (pkg.version !== main.version) {
              throw new Error(`${dir}: version ${pkg.version} does not match the workspace ${main.version}`);
            }
            console.log(`${pkg.name}@${pkg.version} ok (${bin.join(", ")})`);
          }
          EOF

      # Platform packages first: the main package declares them as its
      # optionalDependencies, and a consumer must never hit a missing one.
      # A re-run after a partial publish must skip what is already out,
      # or the loop can never go green.
      - name: Publish the platform packages
        if: ${{ !inputs.dry-run }}
        run: scripts/npm-publish.sh npm/npm-*

      # The dev manifest stays free of version pins: the platform packages
      # do not exist between releases, and a frozen pnpm install would fail
      # on them, so the release manifest is composed here.
      # Staging is pure local file ops and runs on dispatch too: the
      # rehearsal must exercise the step that once burned a release.
      - name: Stage the main package
        run: |
          node <<'EOF'
          const fs = require("fs");
          const main = JSON.parse(fs.readFileSync("crates/nexus-raw-napi/package.json", "utf8"));
          const version = main.version;
          const pkg = {
            ...main,
            optionalDependencies: {
              "@nexus-raw/nxr-linux-x64-gnu": version,
              "@nexus-raw/nxr-linux-arm64-gnu": version,
              "@nexus-raw/nxr-darwin-x64": version,
              "@nexus-raw/nxr-darwin-arm64": version,
              "@nexus-raw/nxr-win32-x64-msvc": version,
            },
          };
          fs.mkdirSync("pkg-main", { recursive: true });
          for (const f of main.files) {
            // A nested file (bin/nxr.js) needs its parent inside pkg-main:
            // copyFileSync does not create directories.
            fs.mkdirSync(require("node:path").dirname(`pkg-main/${f}`), { recursive: true });
            fs.copyFileSync(`crates/nexus-raw-napi/${f}`, `pkg-main/${f}`);
          }
          fs.copyFileSync("crates/nexus-raw-napi/README.md", "pkg-main/README.md");
          fs.writeFileSync("pkg-main/package.json", JSON.stringify(pkg, null, 2) + "\n");
          EOF

      # The main package declares the platform packages as its
      # optionalDependencies: publishing it while one of them is missing
      # would silently break `require` for every consumer of this version.
      - name: The platform packages are on the registry
        if: ${{ !inputs.dry-run }}
        run: scripts/check-npm-platform-packages.sh

      # The consumer smoke installs the staged main package the way a user
      # would (fresh sandbox, real resolve of the platform addon from the
      # registry) and requires the surface. It catches a "green CI, dead
      # package" — a publish whose loader cannot resolve its addon — before
      # the main package goes out, which is the point of no return.
      # The step runs in the rehearsal too: it burned two real releases by
      # never executing before the dispatch. In a rehearsal the addon resolves
      # from the published latest (the fresh one is not built for all targets
      # yet) and the surface check covers the core only: a method added in
      # this release is absent from the published addon binary.
      - name: Consumer smoke of the staged package
        run: |
          version="$(node -p "require('./crates/nexus-raw-napi/package.json').version")"
          if [ -n "${{ inputs.dry-run && 'dry' || '' }}" ]; then
            addon_spec="@nexus-raw/nxr-linux-x64-gnu@latest"
          else
            addon_spec="@nexus-raw/nxr-linux-x64-gnu@${version}"
          fi
          mkdir -p /tmp/consumer-smoke && cd /tmp/consumer-smoke
          echo '{"name":"consumer-smoke","private":true,"dependencies":{"@nexus-raw/nxr":"'"$version"'"}}' > package.json
          # The staged package installs as a tarball, not a file: spec: a
          # directory install symlinks, node resolves the symlink to its
          # realpath, and the addon require then walks up the staging tree
          # where no node_modules exists (verified on mannequins: file: FAIL,
          # tarball OK). The tarball lands as a real copy: the addon sits as
          # its sibling, the exact layout a fresh user install produces.
          # One reify for both specs: a second install would re-reconcile the
          # tree against package.json and drop the first package (npm/cli#4828),
          # and the main version is not on the registry yet to survive it.
          npm pack "${{ github.workspace }}/pkg-main" --pack-destination /tmp/consumer-smoke
          npm install --no-package-lock --no-save "./nexus-raw-nxr-${version}.tgz" "$addon_spec"
          node <<'EOF'
            const fs = require("fs");
            const nxr = require("@nexus-raw/nxr");
            const dts = fs.readFileSync(process.env.GITHUB_WORKSPACE + "/pkg-main/index.d.ts", "utf8");
            const declared = [...dts.matchAll(/^export function (\w+)/gm)].map((m) => m[1]);
            if (declared.length < 10) {
              throw new Error(`consumer smoke: only ${declared.length} functions parsed from index.d.ts, the d.ts shape drifted`);
            }
            const core = ["up", "down", "verify"].filter((m) => typeof nxr[m] !== "function");
            if (core.length > 0) {
              throw new Error(`consumer smoke: the core surface is missing ${core.join(", ")}`);
            }
            if (process.env.SMOKE_MODE === "release") {
              const missing = declared.filter((m) => typeof nxr[m] !== "function");
              if (missing.length > 0) {
                throw new Error(`consumer smoke: the surface is missing ${missing.join(", ")}`);
              }
            }
            console.log(`consumer smoke: core ok, ${declared.length} declared functions resolve (mode ${process.env.SMOKE_MODE})`);
          EOF
          # The CLI rides the package: the bin wrapper must spawn the real
          # binary end to end. Both modes: the rehearsal installs the
          # published latest addon, which carries bin/ since 0.19.0, so the
          # check rides the latest wrapper there and the staged one in a
          # release. The release-only gate went away with that: this check is
          # exactly what caught the non-executable binary.
          ./node_modules/.bin/nxr --version
          echo "consumer smoke: nxr --version ok"
        env:
          SMOKE_MODE: ${{ inputs.dry-run && 'rehearsal' || 'release' }}

      - name: Publish the main package
        if: ${{ !inputs.dry-run }}
        run: scripts/npm-publish.sh pkg-main

  # The Python reference client ships to PyPI: the same stdlib-only nxr.py,
  # installable without a checkout. Trusted publishing, like npm: no token.
  # The version lives in clients/python/pyproject.toml, the gate asserted it
  # agrees with the workspace before anything ran.
  pypi:
    name: Publish the python client
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      # Trusted publishing to PyPI exchanges the workflow identity for an
      # upload credential: id-token is the whole exchange.
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Build the wheel and the sdist
        run: |
          python -m pip install --quiet build
          python -m build clients/python

      - name: The wheel imports
        run: |
          python -m pip install --quiet clients/python/dist/*.whl
          python -c "import nxr; assert 'Nxr' in nxr.__all__; print('wheel import ok,', len(nxr.__all__), 'names')"

      # The pypa upload has no skip: a re-dispatch after a partial failure
      # would die on "file already exists" instead of idling through. The
      # same already-out guard every publish step here carries.
      - name: Already on PyPI
        id: pypi-guard
        if: ${{ !inputs.dry-run }}
        run: scripts/pypi-guard.sh

      - name: Publish to PyPI
        if: ${{ !inputs.dry-run && steps.pypi-guard.outputs.skip != 'true' }}
        uses: pypa/gh-action-pypi-publish@v1.14.2
        with:
          packages-dir: clients/python/dist
          # A guard check can race the CDN: run A published, run B's check
          # reads a stale packument and attempts the upload. skip-existing
          # downgrades the registry's "file already exists" to a warning;
          # with OIDC trusted publishing nothing can be overwritten.
          skip-existing: true

  # The unscoped bridge package forwards the old npm name to the current one:
  # version in lockstep, publish right after the main package, and the surface
  # mirrors it 1:1 (the docs gate asserts the mirror). Babel-core's bridge
  # pattern: npm has no rename, so the old name keeps resolving.
  bridge:
    name: Publish the npm bridge
    needs: npm
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"

      - name: The surface mirrors the main package
        run: scripts/check-bridge-surface.sh

      # The bridge depends on the main package at the exact same version:
      # an install of the bridge before main lands fails ERESOLVE. The same
      # rule the npm job holds for its platform packages, one level down.
      - name: The main package is on the registry
        if: ${{ !inputs.dry-run }}
        run: scripts/check-npm-main-package.sh

      - name: Publish the bridge
        if: ${{ !inputs.dry-run }}
        run: scripts/npm-publish.sh packaging/npm-bridge

  # The last job, and the only one that touches tags: after every artifact
  # is confirmed visible on its registry, the tree gets its tag and its
  # release. A run that stops earlier leaves no tag, so a fix is a push and
  # a fresh dispatch, never a moved tag.
  # The container job is part of the needs: it reads its pushed manifest list
  # back from GHCR itself, and a failed push has to hold the tag back like any
  # other artifact.
  finalize:
    name: Tag and publish the release
    needs: [publish, build, container, node, npm, pypi, bridge]
    if: ${{ !inputs.dry-run }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24

      # The gate checked the tag before anything ran; this re-checks the
      # outcome after everything ran. The 0.2.0 release once shipped green
      # with a package missing from the registry: the tag only lands when
      # every artifact of this version is actually served, and the audit
      # polls every registry with a budget before it judges.
      - name: Every artifact is visible on the registries
        run: scripts/registry-audit.sh

      - name: Collect the archives
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: bins-*
          path: dist
          merge-multiple: true

      - name: Verify the checksums
        run: |
          cd dist
          cat -- *.sha256 > SHA256SUMS
          sha256sum -c SHA256SUMS

      # The release notes are the changelog: the same section `just release`
      # finalized into the tree. A section that names no version falls back
      # to the generated notes instead of shipping the wrong text.
      - name: Notes from the changelog
        run: |
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml)"
          python3 - "$version" <<'PYEOF'
          import sys
          version = sys.argv[1]
          s = open('CHANGELOG.md').read()
          marker = f'## [{version}]'
          if marker not in s:
              open('/tmp/notes.md', 'w').write('')
              print(f'no {marker} section, the release falls back to generated notes')
          else:
              start = s.index(marker)
              end = s.index('\n## [', start + 1)
              open('/tmp/notes.md', 'w').write(s[start:end].rstrip() + '\n')
          PYEOF

      - name: Create the tag and the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml)"
          # Idempotent like every publish guard: a rerun after a half-done
          # finalize skips the create and refreshes the uploads.
          if gh release view "v$version" > /dev/null 2>&1; then
            echo "release v$version already exists, keeping it"
          else
            if [ -s /tmp/notes.md ]; then
              gh release create "v$version" --target "$GITHUB_SHA" --title "v$version" --notes-file /tmp/notes.md
            else
              gh release create "v$version" --target "$GITHUB_SHA" --title "v$version" --generate-notes
            fi
          fi
          gh release upload "v$version" dist/nxr-*.tar.gz dist/SHA256SUMS --clobber
          # The agent-facing docs snapshot rides the release: an agent pinned
          # to this version reads the documentation of exactly its version,
          # while the site keeps serving the latest. Site URLs rewrite to the
          # raw markdown at this tag: a page that exists at the tag, not a
          # rendered-site path that does not.
          sed -E "s|https://lipen\\.github\\.io/nexus-raw/(.+)/|https://raw.githubusercontent.com/Lipen/nexus-raw/v${version}/docs/\\1.md|g" docs/llms.txt > /tmp/llms.txt
          gh release upload "v$version" /tmp/llms.txt --clobber

# `nexus-raw-napi` is `publish = false`: its crates.io twin would be dead
# weight, the npm registry above is the artifact channel.
