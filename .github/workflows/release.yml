name: Release

# A tag is the release. The workflow refuses a tag that disagrees with the
# workspace version, publishes the crates in dependency order, builds the
# platform binaries, and attaches them to the GitHub release whose generated
# notes are the changelog.
# `workflow_dispatch` runs the binary matrix alone: the same build jobs, no
# crates.io, no release - the way to test this workflow without spending a
# tag or a version number.
# The `publish-npm` input is the recovery hatch for a failed tag run: it
# publishes the npm main package from the dispatched ref.
on:
  push:
    tags: [v*]
  workflow_dispatch:
    inputs:
      publish-npm:
        description: Publish the npm main package from this ref (recovery for a failed tag run)
        type: boolean
        default: false

# Least privilege: builds only read; the two jobs that touch the GitHub
# release (publish opens it, attach uploads to it) grant the write locally.
permissions:
  contents: read

jobs:
  publish:
    name: Publish the crates
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # The job opens the GitHub release the binaries later ride on.
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable

      - name: Set up Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          cache-on-failure: true

      # The version lives in one place; a tag that disagrees with it would
      # publish a number nobody wrote down.
      - name: Tag matches the workspace version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          workspace="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml)"
          if [ "$tag" != "$workspace" ]; then
            echo "tag $GITHUB_REF_NAME does not match workspace version $workspace" >&2
            exit 1
          fi
          echo "releasing $workspace"

      # The same full agreement `just check` asserts locally: the internal
      # dependency line and the npm package must not drift, and the tag gate
      # cannot rely on the master CI run that races it here.
      - name: The whole workspace agrees on the version
        run: scripts/version-check.sh

      # Order matters: nexus-raw depends on nexus-raw-core by version.
      # A re-run after a transient failure mid-run must skip what is already
      # out, or one bad moment would poison every retry forever.
      - name: Publish nexus-raw-core
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml)"
          if curl -sf "https://index.crates.io/ne/xu/nexus-raw-core" | grep -q "\"vers\":\"$version\""; then
            echo "nexus-raw-core@$version is already on crates.io, skipping"
          else
            cargo publish --locked -p nexus-raw-core
          fi

      # crates.io resolves a dependent only after the index carries the
      # dependency, which takes a moment after the upload.
      - name: Wait for the index
        run: sleep 30

      # The mock is a fixture other projects' harnesses drive; it depends on
      # nothing inside the workspace, so it can publish on its own.
      - name: Publish mock-nexus
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml)"
          if curl -sf "https://index.crates.io/mo/ck/mock-nexus" | grep -q "\"vers\":\"$version\""; then
            echo "mock-nexus@$version is already on crates.io, skipping"
          else
            cargo publish --locked -p mock-nexus
          fi

      - name: Publish nexus-raw
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml)"
          if curl -sf "https://index.crates.io/ne/xu/nexus-raw" | grep -q "\"vers\":\"$version\""; then
            echo "nexus-raw@$version is already on crates.io, skipping"
          else
            cargo publish --locked -p nexus-raw
          fi

      - name: Open the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes

  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - name: darwin-x64
            os: macos-latest
            target: x86_64-apple-darwin
          - name: darwin-arm64
            os: macos-latest
            target: aarch64-apple-darwin
          - name: windows-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          targets: ${{ matrix.target }}

      - name: Set up Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          cache-on-failure: true
          key: ${{ matrix.target }}

      # The musl target links C code from ring statically; that needs the
      # musl cross toolchain, not just the Rust target.
      - name: Install the musl toolchain
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build nxr
        run: cargo build --locked --release -p nexus-raw --target ${{ matrix.target }}

      - name: Strip the binary
        if: runner.os != 'Windows'
        run: strip "target/${{ matrix.target }}/release/nxr"

      # The binary has to run before it ships: this catches a broken link
      # (missing loader, bad static libc) far cheaper than a user would.
      - name: Smoke the binary
        shell: bash
        run: |
          bin="target/${{ matrix.target }}/release/nxr"
          if [ "${{ runner.os }}" = Windows ]; then bin="$bin.exe"; fi
          "$bin" --version

      - name: Pack and checksum
        shell: bash
        run: |
          bin="target/${{ matrix.target }}/release/nxr"
          if [ "${{ runner.os }}" = Windows ]; then bin="$bin.exe"; fi
          mkdir stage
          cp "$bin" README.md LICENSE stage/
          archive="nxr-${{ matrix.name }}.tar.gz"
          tar -czf "$archive" -C stage .
          # macOS ships shasum, not GNU sha256sum; the emitted lines are the
          # same "hash  name" either way, which is what SHA256SUMS needs.
          if command -v sha256sum > /dev/null 2>&1; then
            sha256sum "$archive" > "$archive.sha256"
          else
            shasum -a 256 "$archive" > "$archive.sha256"
          fi

      - name: Upload the archive
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bins-${{ matrix.name }}
          path: |
            nxr-*.tar.gz
            nxr-*.tar.gz.sha256
          if-no-files-found: error

  attach:
    name: Attach the binaries
    needs: [publish, build]
    # On a tag the archives ride on the release the publish job opened; a
    # dispatch run has no release, so the files stop at the workflow
    # artifacts.
    if: ${{ always() && needs.build.result == 'success' && (github.event_name == 'workflow_dispatch' || needs.publish.result == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The only job that writes to the GitHub release.
    permissions:
      contents: write
    steps:
      - name: Collect the archives
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: bins-*
          path: dist
          merge-multiple: true

      - name: Verify the checksums
        run: |
          cd dist
          cat *.sha256 > SHA256SUMS
          sha256sum -c SHA256SUMS

      - name: Stop at the workflow artifacts
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: binaries
          path: dist/*
          if-no-files-found: error

      - name: Upload to the release
        if: github.event_name == 'push'
        # The job has no checkout: without a git remote gh cannot infer the
        # repository, so the release is named explicitly.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload "$GITHUB_REF_NAME" dist/nxr-*.tar.gz dist/SHA256SUMS --clobber

  node:
    name: Node addon ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # win32-x64-msvc joins when its placeholder package clears the npm
        # spam filter (403 on first publish, support ticket filed).
        include:
          - name: linux-x64-gnu
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            platform-os: linux
            platform-cpu: x64
          - name: darwin-x64
            os: macos-latest
            target: x86_64-apple-darwin
            platform-os: darwin
            platform-cpu: x64
          - name: darwin-arm64
            os: macos-latest
            target: aarch64-apple-darwin
            platform-os: darwin
            platform-cpu: arm64
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          targets: ${{ matrix.target }}

      - name: Set up Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          cache-on-failure: true
          key: node-${{ matrix.target }}

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          package_json_file: crates/nexus-raw-napi/package.json

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: crates/nexus-raw-napi/pnpm-lock.yaml

      - name: Install the dependencies
        run: cd crates/nexus-raw-napi && pnpm ci

      - name: Build the release addon
        run: cd crates/nexus-raw-napi && pnpm exec napi build --platform --release --target ${{ matrix.target }} --js binding.cjs --dts binding.d.ts

      # The staged package is what npm publish ships: the loader requires
      # the package name, and its main file is the renamed addon.
      - name: Stage the platform package
        run: |
          cd crates/nexus-raw-napi
          mkdir -p "npm/nexus-raw-${{ matrix.name }}"
          cp nexus-raw.*.node "npm/nexus-raw-${{ matrix.name }}/index.node"
          node -e '
            const fs = require("fs");
            const main = JSON.parse(fs.readFileSync("package.json", "utf8"));
            const pkg = {
              name: "nexus-raw-" + process.argv[1],
              version: main.version,
              description: "Prebuilt nexus-raw native addon",
              license: "MIT",
              repository: main.repository,
              os: [process.argv[2]],
              cpu: [process.argv[3]],
              main: "index.node",
              files: ["index.node"],
            };
            fs.writeFileSync("npm/nexus-raw-" + process.argv[1] + "/package.json", JSON.stringify(pkg, null, 2) + "\n");
          ' "${{ matrix.name }}" "${{ matrix.platform-os }}" "${{ matrix.platform-cpu }}"

      - name: Upload the staged package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: npm-${{ matrix.name }}
          path: crates/nexus-raw-napi/npm/nexus-raw-${{ matrix.name }}
          if-no-files-found: error

      # binding.cjs and binding.d.ts are generated by the build, not
      # committed.
      # The publish job stages from a fresh checkout, so the generated
      # loader and typings travel with the artifacts.
      # The loader is platform-independent, and one job uploads it.
      - name: Upload the generated main-package files
        if: matrix.name == 'linux-x64-gnu'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: main-generated
          path: |
            crates/nexus-raw-napi/binding.cjs
            crates/nexus-raw-napi/binding.d.ts
          if-no-files-found: error

  npm:
    name: Publish the npm packages
    needs: [node]
    if: ${{ always() && needs.node.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      # OIDC publish: npm exchanges the workflow identity for a short-lived
      # credential, matched against the per-package trusted publisher.
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # npm >= 11.5 speaks trusted publishing.
      # Node 24 carries it.
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24

      # No merge-multiple: every artifact carries a package.json of its own,
      # a flat merge would keep only the last one downloaded.
      - name: Collect the staged packages
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: npm-*
          path: npm

      - name: Collect the generated main-package files
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: main-generated
          path: crates/nexus-raw-napi

      # Runs on dispatch too: a rehearsal must exercise the same collection
      # and validation a real release would, or it rehearses nothing.
      - name: Validate the staged packages
        run: |
          node <<'EOF'
          const fs = require("fs");
          const main = JSON.parse(fs.readFileSync("crates/nexus-raw-napi/package.json", "utf8"));
          const dirs = fs.readdirSync("npm").filter((d) => d.startsWith("npm-"));
          if (dirs.length !== 3) {
            throw new Error(`expected 3 staged packages, found ${dirs.length}`);
          }
          for (const dir of dirs) {
            const pkg = JSON.parse(fs.readFileSync(`npm/${dir}/package.json`, "utf8"));
            if (!fs.existsSync(`npm/${dir}/index.node`)) {
              throw new Error(`${dir}: index.node is missing`);
            }
            if (pkg.name !== "nexus-raw-" + dir.slice(4)) {
              throw new Error(`${dir}: package name ${pkg.name} does not match the artifact`);
            }
            if (pkg.version !== main.version) {
              throw new Error(`${dir}: version ${pkg.version} does not match the workspace ${main.version}`);
            }
            console.log(`${pkg.name}@${pkg.version} ok`);
          }
          EOF

      # Platform packages first: the main package declares them as its
      # optionalDependencies, and a consumer must never hit a missing one.
      # A re-run after a partial publish must skip what is already out,
      # or the loop can never go green.
      - name: Publish the platform packages
        if: ${{ github.event_name == 'push' }}
        run: |
          version="$(node -p "require('./crates/nexus-raw-napi/package.json').version")"
          for d in npm/npm-*/; do
            name="$(node -p "require('./$d/package.json').name")"
            if npm view "$name@$version" version > /dev/null 2>&1; then
              echo "$name@$version is already on the registry, skipping"
            else
              npm publish "$d" --provenance --access public
            fi
          done

      # The dev manifest stays free of version pins: the platform packages
      # do not exist between releases, and a frozen pnpm install would fail
      # on them, so the release manifest is composed here from the tag.
      # Staging is pure local file ops and runs on dispatch too: the
      # rehearsal must exercise the step that once burned a release.
      # The version comes from the manifest, which the tag check has
      # already matched against the ref.
      - name: Stage the main package
        run: |
          node <<'EOF'
          const fs = require("fs");
          const main = JSON.parse(fs.readFileSync("crates/nexus-raw-napi/package.json", "utf8"));
          const version = main.version;
          const pkg = {
            ...main,
            optionalDependencies: {
              "nexus-raw-linux-x64-gnu": version,
              "nexus-raw-darwin-x64": version,
              "nexus-raw-darwin-arm64": version,
            },
          };
          fs.mkdirSync("pkg-main", { recursive: true });
          for (const f of main.files) {
            fs.copyFileSync(`crates/nexus-raw-napi/${f}`, `pkg-main/${f}`);
          }
          fs.copyFileSync("crates/nexus-raw-napi/README.md", "pkg-main/README.md");
          fs.writeFileSync("pkg-main/package.json", JSON.stringify(pkg, null, 2) + "\n");
          EOF

      # The main package declares the platform packages as its
      # optionalDependencies: publishing it while one of them is missing
      # would silently break `require` for every consumer of this version.
      # The guard runs wherever the main package does, so a recovery
      # dispatch cannot outpace the packages it depends on.
      - name: The platform packages are on the registry
        if: ${{ github.event_name == 'push' || inputs.publish-npm == true }}
        run: |
          version="$(node -p "require('./crates/nexus-raw-napi/package.json').version")"
          for name in nexus-raw-linux-x64-gnu nexus-raw-darwin-x64 nexus-raw-darwin-arm64; do
            # The registry serves fresh publishes with a lag: a check that runs
            # right after the platform publish can miss a package that landed.
            # Retry before refusing, so a green release never dies to propagation.
            ok=0
            for attempt in 1 2 3 4 5; do
              if npm view "$name@$version" version > /dev/null 2>&1; then
                ok=1
                break
              fi
              echo "$name@$version not visible yet (attempt $attempt), waiting"
              sleep 15
            done
            if [ "$ok" != 1 ]; then
              echo "refusing to publish nexus-raw@$version: $name@$version is not on the registry, its optionalDependencies entry would fail to resolve" >&2
              exit 1
            fi
            echo "$name@$version is on the registry"
          done

      - name: Publish the main package
        if: ${{ github.event_name == 'push' || inputs.publish-npm == true }}
        run: |
          version="$(node -p "require('./crates/nexus-raw-napi/package.json').version")"
          if npm view "nexus-raw@$version" version > /dev/null 2>&1; then
            echo "nexus-raw@$version is already on the registry, skipping"
          else
            npm publish ./pkg-main --provenance --access public
          fi

# `nexus-raw-napi` is `publish = false`: its crates.io twin would be dead
# weight, the npm registry above is the artifact channel.
