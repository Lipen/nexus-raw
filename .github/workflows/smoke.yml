name: Smoke

# The release smoke runs on ubuntu only: the published darwin and win32
# addon binaries never load anywhere in the pipeline. This workflow loads
# the published package on the three desktop OSes, dispatch or schedule,
# so a dead addon or an OS-divergent surface surfaces here instead of in
# a user issue.

on:
  workflow_dispatch:
  schedule:
    # 04:20 UTC, daily: long after the release window closes.
    - cron: "20 4 * * *"

concurrency:
  group: smoke
  cancel-in-progress: false

jobs:
  load:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - name: Build the mock server
        run: cargo build -q -p mock-nexus
      # The same published-consumer gate the release verify job runs, on
      # every desktop OS: main, CLI, example, bridge require and bridge ESM.
      - name: Run the published consumer checks
        run: scripts/verify-published.sh latest
