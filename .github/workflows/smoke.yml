name: Smoke

# The release smoke runs on ubuntu only: the published darwin and win32
# addon binaries never load anywhere in the pipeline. This workflow loads
# the published package on the three desktop OSes, dispatch or schedule,
# so a dead addon or an OS-divergent surface surfaces here instead of in
# a user issue.

on:
  workflow_dispatch:
  schedule:
    # 04:20 UTC, daily: long after the release window closes.
    - cron: "20 4 * * *"

concurrency:
  group: smoke
  cancel-in-progress: false

jobs:
  load:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
      - name: Install and load the published package
        run: |
          mkdir -p tmp-smoke && cd tmp-smoke
          echo '{"name":"os-smoke","private":true}' > package.json
          npm install --no-package-lock --no-save "@nexus-raw/nxr@latest"
          node -e '
            const fs = require("fs");
            const path = require("path");
            const nxr = require("@nexus-raw/nxr");
            const entry = require.resolve("@nexus-raw/nxr");
            const dts = fs.readFileSync(path.join(path.dirname(entry), "index.d.ts"), "utf8");
            const declared = [...dts.matchAll(/^export function (\w+)/gm)].map((m) => m[1]);
            if (declared.length < 10) {
              throw new Error(`os smoke: only ${declared.length} functions parsed from index.d.ts, the d.ts shape drifted`);
            }
            const missing = declared.filter((m) => typeof nxr[m] !== "function");
            if (missing.length > 0) {
              throw new Error(`os smoke (${process.platform}): the surface is missing ${missing.join(", ")}`);
            }
            console.log(`os smoke (${process.platform}): ${declared.length} declared functions resolve`);
          '
