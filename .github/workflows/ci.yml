name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

# Least-privilege token: CI only reads the repo; docs.yml scopes its own writes.
permissions:
  contents: read

# One pipeline per branch or PR: a new run cancels the superseded one.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable

      - name: Set up Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          cache-on-failure: true

      - name: Run tests
        run: cargo test --workspace

  # The manifest pins the minimum supported Rust version; this proves the
  # pinned toolchain still builds the workspace, cheaply and early.
  msrv:
    name: MSRV (1.88)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Rust 1.88
        uses: dtolnay/rust-toolchain@94ec8bc822f50f94d0e68501cff2eb388c550726 # 1.88

      - name: Set up Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          cache-on-failure: true

      - name: Check the workspace on the MSRV
        run: cargo check --workspace --all-targets

  # The release number lives in one place; a second copy that drifted would
  # ship a number nobody wrote down.
  version:
    name: Version agreement
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Check the version agrees everywhere
        run: scripts/version-check.sh

  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          components: rustfmt

      - name: Run rustfmt
        run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          components: clippy

      - name: Set up Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          cache-on-failure: true

      - name: Run clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  # The wasm sandbox pins the read surface: the browser slice of the core must
  # keep compiling for wasm32, the glue must keep generating, and the page must
  # keep listing the demo repository. The smoke runs the built wasm end to end
  # under plain node (listing, pagination, one retried failure); it adds the
  # headless browser pass itself when the machine carries a chromium binary,
  # so the job stays dependency-light.
  wasm:
    name: Wasm sandbox
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          targets: wasm32-unknown-unknown

      - name: Set up Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: examples/wasm-sandbox
          cache-on-failure: true

      - name: Build the sandbox for wasm32
        working-directory: examples/wasm-sandbox
        run: cargo build --target wasm32-unknown-unknown --release --locked

      # wasm-bindgen refuses to generate glue across versions, so the CLI comes
      # from the release of exactly the version the lockfile resolved.
      - name: Install wasm-bindgen-cli
        working-directory: examples/wasm-sandbox
        run: |
          version="$(cargo metadata --format-version 1 | jq -r '.packages[] | select(.name == "wasm-bindgen") | .version')"
          dir="$RUNNER_TEMP/wasm-bindgen-$version"
          mkdir -p "$dir"
          curl -sSfL "https://github.com/rustwasm/wasm-bindgen/releases/download/$version/wasm-bindgen-$version-x86_64-unknown-linux-musl.tar.gz" \
            | tar xz --strip-components=1 -C "$dir" "wasm-bindgen-$version-x86_64-unknown-linux-musl/wasm-bindgen"
          echo "$dir" >> "$GITHUB_PATH"

      - name: Generate the glue
        working-directory: examples/wasm-sandbox
        run: wasm-bindgen --target web --out-dir pkg target/wasm32-unknown-unknown/release/nexus_raw_example_wasm_sandbox.wasm

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Smoke the built sandbox
        working-directory: examples/wasm-sandbox
        run: node smoke.mjs

  # The Node addon: a cargo build wrapped by the napi CLI. `npm run
  # build:debug` compiles the crate and leaves the platform addon, the
  # generated loader (binding.cjs) and the generated declarations
  # (binding.d.ts) next to crates/nexus-raw-napi.
  addon:
    name: Node addon (linux)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable

      - name: Set up Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          cache-on-failure: true

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          package_json_file: crates/nexus-raw-napi/package.json

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: crates/nexus-raw-napi/pnpm-lock.yaml

      - name: Build the Node addon
        run: cd crates/nexus-raw-napi && pnpm ci && pnpm run build:debug

      # index.d.ts is hand-maintained; the build above regenerated
      # binding.d.ts from the Rust source, so this fails when the two drift.
      - name: Guard index.d.ts against drift
        run: node crates/nexus-raw-napi/check-dts.mjs

      # The addon has to run before it ships: the smoke drives verify and
      # sha on a local directory, so it needs nothing but the build above.
      - name: Smoke the built addon
        run: node crates/nexus-raw-napi/smoke.mjs

      # The documented consumer style is a named ESM import; the CJS
      # wrapper only exposes those when the lexer sees dot assignments, so
      # this fails exactly when an `import { up } from 'nexus-raw'` would.
      - name: Named ESM imports resolve
        working-directory: crates/nexus-raw-napi
        run: |
          node --eval "import('./index.js').then((m) => { const missing = ['get', 'put', 'head', 'sha', 'up', 'down', 'verify', 'channelGet', 'channelSet'].filter((f) => typeof m[f] !== 'function'); if (missing.length > 0) { throw new Error('named ESM exports missing: ' + missing.join(', ')) } })"

      # The demo spawns the mock itself (`mock-nexus --port 0`) and reads the
      # URL from its stdout, so a fresh build of the binary is all it needs.
      - name: Build the mock server
        run: cargo build -q -p mock-nexus

      - name: Run the Node smoke
        run: cd examples/node && pnpm ci && node publish-and-consume.mjs

  # macOS builds the addon for the host triple (no prebuilt packages are
  # involved in a local build) and the demo is plain Node plus a spawned
  # mock binary, so the full smoke runs here unchanged.
  addon-macos:
    name: Node addon (macOS)
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable

      - name: Set up Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          cache-on-failure: true

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          package_json_file: crates/nexus-raw-napi/package.json

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: crates/nexus-raw-napi/pnpm-lock.yaml

      - name: Build the Node addon
        run: cd crates/nexus-raw-napi && pnpm ci && pnpm run build:debug

      # The addon has to run before it ships: the smoke drives verify and
      # sha on a local directory, so it needs nothing but the build above.
      - name: Smoke the built addon
        run: node crates/nexus-raw-napi/smoke.mjs

      # The documented consumer style is a named ESM import; the CJS
      # wrapper only exposes those when the lexer sees dot assignments, so
      # this fails exactly when an `import { up } from 'nexus-raw'` would.
      - name: Named ESM imports resolve
        working-directory: crates/nexus-raw-napi
        run: |
          node --eval "import('./index.js').then((m) => { const missing = ['get', 'put', 'head', 'sha', 'up', 'down', 'verify', 'channelGet', 'channelSet'].filter((f) => typeof m[f] !== 'function'); if (missing.length > 0) { throw new Error('named ESM exports missing: ' + missing.join(', ')) } })"

      - name: Build the mock server
        run: cargo build -q -p mock-nexus

      - name: Run the Node smoke
        run: cd examples/node && pnpm ci && node publish-and-consume.mjs

  # Windows stays at compile-and-load: the demo spawns the mock binary by a
  # POSIX-style path (target/debug/mock-nexus), which a Windows process
  # cannot launch without the .exe suffix, so the full smoke stays on linux
  # and macOS until the demo learns platform paths.
  addon-windows:
    name: Node addon (Windows)
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable

      - name: Set up Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          cache-on-failure: true

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          package_json_file: crates/nexus-raw-napi/package.json

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: crates/nexus-raw-napi/pnpm-lock.yaml

      - name: Check the addon crate
        run: cargo check -p nexus-raw-napi

      - name: Build the Node addon
        run: cd crates/nexus-raw-napi && pnpm ci && pnpm run build:debug

      # Requiring the built addon proves the generated loader finds the
      # platform binary and the wrapper exports the whole surface.
      - name: Load the built addon
        shell: bash
        run: |
          node --eval "const nxr = require('./crates/nexus-raw-napi/index.js'); const missing = ['get', 'put', 'head', 'sha', 'up', 'down', 'verify', 'channelGet', 'channelSet'].filter((f) => typeof nxr[f] !== 'function'); if (missing.length > 0) { throw new Error('addon surface missing: ' + missing.join(', ')) }"
