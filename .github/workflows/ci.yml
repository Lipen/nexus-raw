name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

# Least-privilege token: CI only reads the repo; docs.yml scopes its own writes.
permissions:
  contents: read

# One pipeline per branch or PR: a new run cancels the superseded one.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Every platform the release ships a binary for, minus the ones only
        # the release build exercises: darwin has code paths linux never runs
        # (no /proc, a different flock), and it was the untested one.
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - name: Set up Rust cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          cache-on-failure: true

      - name: Run tests
        run: cargo test --workspace

  # The hooks the local git hook runs, run by CI too: a contributor without
  # prek installed otherwise skips actionlint, the markdown semicolon rule and
  # the external-name check entirely. The tool versions live in prek.toml, so
  # the local and CI gates cannot drift apart.
  lint:
    name: Hygiene (prek)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: clippy

      - name: Set up Rust cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          cache-on-failure: true

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Run the prek hooks
        run: uvx prek@0.5.7 run --all-files

  # The action is the install path the README advertises: exercise it the way
  # a consumer does, against the current release, on every runner flavor the
  # action supports. It catches a wrong repository context, a missing release
  # asset and a checksum that does not line up, before a consumer does.
  action:
    name: Composite action (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run nxr through the action
        uses: ./
        with:
          command: complete
          args: bash

  # The manifest pins the minimum supported Rust version; this proves the
  # pinned toolchain still builds the workspace, cheaply and early.
  msrv:
    name: MSRV (1.88)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Rust 1.88
        uses: dtolnay/rust-toolchain@360a4e93673de6630fac2478bc9e35244b01a759 # 1.88

      - name: Set up Rust cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          cache-on-failure: true

      - name: Check the workspace on the MSRV
        run: cargo check --workspace --all-targets

  # The release number lives in one place; a second copy that drifted would
  # ship a number nobody wrote down.
  version:
    name: Version agreement
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check the version agrees everywhere
        run: scripts/version-check.sh

      # The formula is a post-release artifact, so this watches master's
      # published state and not a PR: a branch opened before a release
      # predates the bump and would go red for nothing.
      # The check reads the latest release, so a release that publishes
      # while the bump is still uncommitted turns the next master run red
      # until the formula lands.
      - name: Check the tap formula against the latest release
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: scripts/check-brew-formula.sh

  # The dependency gate: licenses, advisories, bans, sources. A lockfile
  # change that carries a vulnerability or a foreign source is red here,
  # not only in a release rehearsal.
  deny:
    name: Dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install cargo-deny
        uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: cargo-deny@0.20.2

      - name: Run cargo-deny
        run: cargo deny --locked check

  # The wasm sandbox pins the read surface: the browser slice of the core must
  # keep compiling for wasm32, the glue must keep generating, and the page must
  # keep listing the demo repository. The smoke runs the built wasm end to end
  # under plain node (listing, pagination, one retried failure); it adds the
  # headless browser pass itself when the machine carries a chromium binary,
  # so the job stays dependency-light.
  wasm:
    name: Wasm sandbox
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: wasm32-unknown-unknown

      - name: Set up Rust cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: examples/wasm-sandbox
          cache-on-failure: true

      # The sandbox build also compiles the workspace core by path. This check
      # is cheap and reports a core error before the bindgen pipeline.
      - name: Check the workspace core for wasm32
        run: cargo check -p nexus-raw-core --target wasm32-unknown-unknown

      - name: Build the sandbox for wasm32
        working-directory: examples/wasm-sandbox
        run: cargo build --target wasm32-unknown-unknown --release --locked

      # wasm-bindgen refuses to generate glue across versions, so the CLI comes
      # from the release of exactly the version the lockfile resolved.
      - name: Install wasm-bindgen-cli
        working-directory: examples/wasm-sandbox
        run: |
          version="$(cargo metadata --format-version 1 | jq -r '.packages[] | select(.name == "wasm-bindgen") | .version')"
          dir="$RUNNER_TEMP/wasm-bindgen-$version"
          mkdir -p "$dir"
          curl -sSfL "https://github.com/rustwasm/wasm-bindgen/releases/download/$version/wasm-bindgen-$version-x86_64-unknown-linux-musl.tar.gz" \
            | tar xz --strip-components=1 -C "$dir" "wasm-bindgen-$version-x86_64-unknown-linux-musl/wasm-bindgen"
          echo "$dir" >> "$GITHUB_PATH"

      - name: Generate the glue
        working-directory: examples/wasm-sandbox
        run: wasm-bindgen --target web --out-dir pkg target/wasm32-unknown-unknown/release/nexus_raw_example_wasm_sandbox.wasm

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      # The runner image's chromium now quits `--dump-dom` at the load event,
      # long before the page's top-level await (the ServiceWorker listing)
      # finishes, so the CLI dump path never sees the beacon. Drive the same
      # binary under CDP instead: playwright-core holds the page open until
      # the harness sees the beacon, not until the browser feels quiescent.
      # No browser download here: the driver launches the image's chromium.
      - name: Set up the browser driver
        run: npm install --prefix /tmp/nxr-playwright --no-fund --no-audit playwright-core@1.64.1

      - name: Smoke the built sandbox
        working-directory: examples/wasm-sandbox
        run: node smoke.mjs
        env:
          NXR_WASM_DRIVER: /tmp/nxr-playwright/node_modules/playwright-core

  # The Node addon: a cargo build wrapped by the napi CLI. `npm run
  # build:debug` compiles the crate and leaves the platform addon, the
  # generated loader (binding.cjs) and the generated declarations
  # (binding.d.ts) next to crates/nexus-raw-napi.
  addon:
    name: Node addon (linux)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - name: Set up Rust cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          cache-on-failure: true

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: crates/nexus-raw-napi/package.json

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: crates/nexus-raw-napi/pnpm-lock.yaml

      - name: Build the Node addon
        run: cd crates/nexus-raw-napi && pnpm ci && pnpm run build:debug

      # index.d.ts is hand-maintained; the build above regenerated
      # binding.d.ts from the Rust source, so this fails when the two drift.
      - name: Guard index.d.ts against drift
        run: node crates/nexus-raw-napi/check-dts.mjs

      # The addon has to run before it ships: the smoke drives verify and
      # sha on a local directory, so it needs nothing but the build above.
      - name: Smoke the built addon
        run: node crates/nexus-raw-napi/smoke.mjs

      # The documented consumer style is a named ESM import; the CJS
      # wrapper only exposes those when the lexer sees dot assignments, so
      # this fails exactly when an `import { up } from 'nexus-raw'` would.
      - name: Named ESM imports resolve
        working-directory: crates/nexus-raw-napi
        run: |
          node --eval "import('./index.js').then((m) => { const missing = ['get', 'put', 'head', 'sha', 'up', 'down', 'verify', 'channelGet', 'channelSet'].filter((f) => typeof m[f] !== 'function'); if (missing.length > 0) { throw new Error('named ESM exports missing: ' + missing.join(', ')) } })"

      # The demo spawns the mock itself (`mock-nexus --port 0`) and reads the
      # URL from its stdout, so a fresh build of the binary is all it needs.
      - name: Build the mock server
        run: cargo build -q -p mock-nexus

      - name: Run the Node smoke
        run: cd examples/node && pnpm install --lockfile=false && node publish-and-consume.mjs

  # macOS builds the addon for the host triple (no prebuilt packages are
  # involved in a local build) and the demo is plain Node plus a spawned
  # mock binary, so the full smoke runs here unchanged.
  addon-macos:
    name: Node addon (macOS)
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - name: Set up Rust cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          cache-on-failure: true

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: crates/nexus-raw-napi/package.json

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: crates/nexus-raw-napi/pnpm-lock.yaml

      - name: Build the Node addon
        run: cd crates/nexus-raw-napi && pnpm ci && pnpm run build:debug

      # The addon has to run before it ships: the smoke drives verify and
      # sha on a local directory, so it needs nothing but the build above.
      - name: Smoke the built addon
        run: node crates/nexus-raw-napi/smoke.mjs

      # The documented consumer style is a named ESM import; the CJS
      # wrapper only exposes those when the lexer sees dot assignments, so
      # this fails exactly when an `import { up } from 'nexus-raw'` would.
      - name: Named ESM imports resolve
        working-directory: crates/nexus-raw-napi
        run: |
          node --eval "import('./index.js').then((m) => { const missing = ['get', 'put', 'head', 'sha', 'up', 'down', 'verify', 'channelGet', 'channelSet'].filter((f) => typeof m[f] !== 'function'); if (missing.length > 0) { throw new Error('named ESM exports missing: ' + missing.join(', ')) } })"

      - name: Build the mock server
        run: cargo build -q -p mock-nexus

      - name: Run the Node smoke
        run: cd examples/node && pnpm install --lockfile=false && node publish-and-consume.mjs

  # Windows stays at compile-and-load: the demo spawns the mock binary by a
  # POSIX-style path (target/debug/mock-nexus), which a Windows process
  # cannot launch without the .exe suffix, so the full smoke stays on linux
  # and macOS until the demo learns platform paths.
  addon-windows:
    name: Node addon (Windows)
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - name: Set up Rust cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          cache-on-failure: true

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: crates/nexus-raw-napi/package.json

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: crates/nexus-raw-napi/pnpm-lock.yaml

      - name: Check the addon crate
        run: cargo check -p nexus-raw-napi

      - name: Build the Node addon
        run: cd crates/nexus-raw-napi && pnpm ci && pnpm run build:debug

      # Requiring the built addon proves the generated loader finds the
      # platform binary and the wrapper exports the whole surface.
      - name: Load the built addon
        shell: bash
        run: |
          node --eval "const nxr = require('./crates/nexus-raw-napi/index.js'); const missing = ['get', 'put', 'head', 'sha', 'up', 'down', 'verify', 'channelGet', 'channelSet'].filter((f) => typeof nxr[f] !== 'function'); if (missing.length > 0) { throw new Error('addon surface missing: ' + missing.join(', ')) }"

  # The python reference client pins the wire contract from the outside: a
  # behavioral drift between it and the rust core fails here, not in an issue.
  python-conformance:
    name: Python conformance
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Lint and format-check the client
        run: |
          uvx ruff@0.17.3 check clients/python
          uvx ruff@0.17.3 format --check clients/python

      - name: Type-check the shipped module
        run: uvx ty@0.0.94 check clients/python/nxr.py

      - name: Build the mock server
        run: cargo build -p mock-nexus

      - name: Run the python conformance suite
        working-directory: clients/python
        env:
          MOCK_NEXUS_BIN: ${{ github.workspace }}/target/debug/mock-nexus
        run: python3 test_conformance.py

  mount-smoke:
    name: Mount smoke (FUSE)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - name: Set up Rust cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          cache-on-failure: true

      - name: Install fuse3
        run: sudo apt-get update && sudo apt-get install -y fuse3

      # The smoke script skips silently without /dev/fuse, which would make a
      # green job meaningless: assert the device and the helper are present.
      - name: Assert the FUSE prerequisites
        run: |
          [ -e /dev/fuse ] || { echo "no /dev/fuse on the runner" >&2; exit 1; }
          command -v fusermount3 >/dev/null || { echo "no fusermount3" >&2; exit 1; }

      - name: Run the mount smoke
        run: scripts/mount-smoke.sh
